---
# Global group variables for K3s homelab tuning and management
k3s_version: "v1.34.6+k3s1"
k3s_server_url: "https://192.168.0.21:6443"
k3s_cluster_cidr: "10.42.0.0/16"
k3s_service_cidr: "10.43.0.0/16"
k3s_cluster_dns: "10.43.0.10"

# Linux Kernel Sysctl Tuning Parameters
sysctl_settings:
  - { name: "vm.swappiness", value: "10" }
  - { name: "fs.inotify.max_user_instances", value: "8192" }
  - { name: "fs.inotify.max_user_watches", value: "524288" }
  - { name: "net.ipv4.ip_forward", value: "1" }
  - { name: "net.bridge.bridge-nf-call-iptables", value: "1" }

# System limits
system_nofile_limit: 1048576

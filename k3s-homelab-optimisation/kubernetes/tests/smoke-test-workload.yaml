# kubernetes/tests/smoke-test-workload.yaml
# Production-ready test workload with resource limits, health probes, and PodDisruptionBudget.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-smoke-test
  namespace: default
  labels:
    app.kubernetes.io/name: platform-smoke-test
    app.kubernetes.io/part-of: homelab-validation
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-smoke-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-smoke-test
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: platform-smoke-test
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: platform-smoke-test-pdb
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-smoke-test

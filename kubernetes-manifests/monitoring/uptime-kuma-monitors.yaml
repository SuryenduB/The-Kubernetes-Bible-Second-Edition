# Uptime-Kuma desired monitors + API credentials.
# monitors.yaml is the SOURCE OF TRUTH. The uptime-kuma-sync CronJob
# (uptime-kuma-sync.yaml) reconciles this list into Uptime-Kuma hourly.
# Sync is ADDITIVE ONLY: removing a monitor here does NOT delete it
# remotely (delete strays in the UI). Drift on listed monitors IS corrected.
#
# NOTE: Uptime-Kuma runs in the `monitoring` namespace, so cross-namespace
# targets MUST use FQDN service DNS (short names do not resolve across
# namespaces): <svc>.<ns>.svc.cluster.local
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: uptime-kuma-monitors
  namespace: monitoring
data:
  monitors.yaml: |
    monitors:
      - name: registry-docker-tcp
        type: port
        hostname: 192.168.0.236
        port: 5000
        interval: 60
        maxretries: 3
        description: Local Docker registry - custom images unpullable when down (IIQ)
      - name: ollama-api
        type: http
        url: http://ollama.ai.svc.cluster.local:11434/
        interval: 60
        maxretries: 3
        description: Ollama API - language backends depend on it (stale-NFS outage 2026-09-06)
      - name: openwebui
        type: http
        url: http://openwebui.ai.svc.cluster.local:8080/
        interval: 60
        maxretries: 3
        description: Open WebUI frontend
      - name: homepage
        type: http
        url: http://homepage.homepage.svc.cluster.local/
        interval: 60
        maxretries: 3
        description: Homepage dashboard
      - name: beszel-hub
        type: http
        url: http://beszel-hub.monitoring.svc.cluster.local/
        interval: 60
        maxretries: 3
        description: Beszel cluster monitoring hub
      - name: uptime-kuma-self
        type: http
        url: http://uptime-kuma.monitoring.svc.cluster.local/
        interval: 60
        maxretries: 3
        description: Uptime-Kuma self check
      - name: linguacafe-web
        type: http
        url: http://linguacafe.linguacafe.svc.cluster.local/
        interval: 60
        maxretries: 3
        description: LinguaCafe reading app (down while mariadb faulted)
      - name: linguacafe-mariadb
        type: port
        hostname: mariadb.linguacafe.svc.cluster.local
        port: 3306
        interval: 60
        maxretries: 3
        description: LinguaCafe MariaDB (faulted - expected DOWN until recovery)
      - name: linguacafe-redis
        type: port
        hostname: redis.linguacafe.svc.cluster.local
        port: 6379
        interval: 60
        maxretries: 3
        description: LinguaCafe Redis cache
      - name: audiobookshelf
        type: http
        url: http://audiobookshelf.media.svc.cluster.local/
        interval: 60
        maxretries: 3
        description: AudioBookshelf audiobooks and podcasts
      - name: calibre-web
        type: http
        url: http://calibre-web.media.svc.cluster.local:8083/
        interval: 60
        maxretries: 3
        description: Calibre-Web ebook management
      - name: iiq-app
        type: port
        hostname: iiq.iiqstack.svc.cluster.local
        port: 80
        interval: 60
        maxretries: 3
        description: SailPoint IdentityIQ (TCP - context auth varies)
      - name: iiq-ldap
        type: port
        hostname: ldap.iiqstack.svc.cluster.local
        port: 389
        interval: 60
        maxretries: 3
        description: IIQ LDAP directory
      - name: iiq-activemq
        type: port
        hostname: activemq.iiqstack.svc.cluster.local
        port: 8161
        interval: 60
        maxretries: 3
        description: IIQ ActiveMQ console port (TCP - console needs auth)
      - name: iiq-mssql
        type: port
        hostname: db.iiqstack.svc.cluster.local
        port: 1433
        interval: 60
        maxretries: 3
        description: IIQ MSSQL database
      - name: iiq-mailpit
        type: http
        url: http://mail.iiqstack.svc.cluster.local:8025/
        interval: 60
        maxretries: 3
        description: IIQ Mailpit email testing dashboard
      - name: iiq-phpldapadmin
        type: port
        hostname: phpldapadmin.iiqstack.svc.cluster.local
        port: 443
        interval: 60
        maxretries: 3
        description: phpLDAPadmin (TCP - self-signed TLS)
      - name: iiq-counter
        type: port
        hostname: counter.iiqstack.svc.cluster.local
        port: 12345
        interval: 60
        maxretries: 3
        description: IIQ demo counter utility
      - name: iiq-ssh
        type: port
        hostname: ssh.iiqstack.svc.cluster.local
        port: 22
        interval: 60
        maxretries: 3
        description: IIQ demo SSH host
      # -----------------------------------------------------------------------
      # Coverage expansion (2026-10-17 mission): cluster infrastructure,
      # notification path, server-management power API, media/data apps and
      # their databases, dashboards, and the monitoring stack itself.
      # Every target pre-flighted from the Kuma pod (curl status verified)
      # before being added. DB ports monitored directly per repo pattern.
      # -----------------------------------------------------------------------
      - name: kubernetes-api
        type: port
        hostname: kubernetes.default.svc.cluster.local
        port: 443
        interval: 60
        maxretries: 3
        description: Kubernetes API service - every controller/tool depends on it
      - name: nas-nfs
        type: port
        hostname: 192.168.0.128
        port: 2049
        interval: 60
        maxretries: 3
        description: Synology NAS NFS export - media libraries and Ollama models depend on it
      - name: longhorn-ui
        type: http
        url: http://longhorn-frontend.longhorn-system.svc.cluster.local/
        interval: 60
        maxretries: 3
        description: Longhorn storage dashboard
      - name: remotepower
        type: http
        url: http://remotepower.server-management.svc.cluster.local/
        interval: 60
        maxretries: 3
        description: Remote power-switch API - homelab start/stop scripts depend on it
      - name: gotify
        type: http
        url: http://gotify.monitoring.svc.cluster.local/
        interval: 60
        maxretries: 3
        description: Gotify push notification server (alert delivery path)
      - name: dozzle
        type: http
        url: http://dozzle.monitoring.svc.cluster.local/
        interval: 60
        maxretries: 3
        description: Dozzle container log viewer
      - name: argocd-server
        type: port
        hostname: argocd-server.argocd.svc.cluster.local
        port: 443
        interval: 60
        maxretries: 3
        description: ArgoCD UI/API (TCP - TLS terminates upstream, 307 on plain HTTP)
      - name: immich
        type: http
        url: http://immich.media.svc.cluster.local/
        interval: 60
        maxretries: 3
        description: Immich photo platform
      - name: immich-db
        type: port
        hostname: immich-db.media.svc.cluster.local
        port: 5432
        interval: 60
        maxretries: 3
        description: Immich Postgres database
      - name: flick
        type: http
        url: http://flick.media.svc.cluster.local/
        interval: 60
        maxretries: 3
        description: Flick media app
      - name: flick-db
        type: port
        hostname: flick-db.media.svc.cluster.local
        port: 5432
        interval: 60
        maxretries: 3
        description: Flick Postgres database
      - name: reactive-resume
        type: http
        url: http://reactive-resume.media.svc.cluster.local/
        interval: 60
        maxretries: 3
        description: Reactive Resume builder
      - name: reactive-resume-db
        type: port
        hostname: reactive-resume-db.media.svc.cluster.local
        port: 5432
        interval: 60
        maxretries: 3
        description: Reactive Resume Postgres database
      - name: chaptarr
        type: http
        url: http://chaptarr.media.svc.cluster.local/
        interval: 60
        maxretries: 3
        description: Chaptarr media app
      # -----------------------------------------------------------------------
      # Node liveness: SSH port per ACTIVE homelab node. Detached keys down a
      # node ~3 min after SSH stops answering (maxretries x interval) and
      # clears on recovery. server-236/252 (retained NotReady) are NOT listed
      # so the dashboard does not show permanent red; registry-docker-tcp
      # already covers .236 liveness.
      # -----------------------------------------------------------------------
      - name: node-nuc-ssh
        type: port
        hostname: 192.168.0.21
        port: 22
        interval: 60
        maxretries: 3
        description: nuc control plane node SSH reachable
      - name: node-kubernetes1-ssh
        type: port
        hostname: 192.168.0.19
        port: 22
        interval: 60
        maxretries: 3
        description: worker kubernetes1 SSH reachable
      - name: node-kubernetes2-ssh
        type: port
        hostname: 192.168.0.20
        port: 22
        interval: 60
        maxretries: 3
        description: worker kubernetes2 SSH reachable
      - name: node-kubernetes3-ssh
        type: port
        hostname: 192.168.0.22
        port: 22
        interval: 60
        maxretries: 3
        description: worker kubernetes3 SSH reachable
      - name: node-kubernetes4-ssh
        type: port
        hostname: 192.168.0.23
        port: 22
        interval: 60
        maxretries: 3
        description: worker kubernetes4 SSH reachable
      - name: node-kubernetes5-ssh
        type: port
        hostname: 192.168.0.24
        port: 22
        interval: 60
        maxretries: 3
        description: worker kubernetes5 SSH reachable
      - name: node-kubernetes6-ssh
        type: port
        hostname: 192.168.0.25
        port: 22
        interval: 60
        maxretries: 3
        description: worker kubernetes6 SSH reachable
      # -----------------------------------------------------------------------
      # Longhorn backup freshness push monitor.
      # The backup-daily-check CronJob (longhorn-backup-monitor.yaml) runs at
      # 04:00 CEST (observed empirically; fires ~24 h after the previous
      # nightly Longhorn backup window), checks that a Completed
      # backup younger than 26 h exists, and pushes status=up to this monitor.
      # If the push is not received within 2× the interval (3600 s), the
      # monitor goes DOWN, meaning the backup-daily cron never finished.
      # IMPORTANT: after this monitor is first created by the sync CronJob,
      # retrieve its push token from the Uptime-Kuma UI and update the
      # `longhorn-backup-push-token` Secret in the monitoring namespace.
      # The token format is: /api/push/<token>   (alphanumeric, ~8 chars)
      # -----------------------------------------------------------------------
      - name: longhorn-backup-daily
        type: push
        interval: 86400
        maxretries: 1
        description: "Longhorn backup-daily job — pushed by backup-daily-check CronJob at 04:00 UTC; goes DOWN if no Completed backup < 26 h"
# NOTE: the API credentials Secret is NOT in Git. It is generated by
# kustomize secretGenerator from the local-only file
# uptime-kuma-credentials.env (gitignored, see .gitignore):
#   username=suryendub
#   password=<uptime-kuma admin password>
# Name must stay `uptime-kuma-credentials` - the sync CronJob references it.

# Uptime-Kuma desired monitors + API credentials.
# monitors.yaml is the SOURCE OF TRUTH. The uptime-kuma-sync CronJob
# (uptime-kuma-sync.yaml) reconciles this list into Uptime-Kuma hourly.
# Sync is ADDITIVE ONLY: removing a monitor here does NOT delete it
# remotely (delete strays in the UI). Drift on listed monitors IS corrected.
#
# NOTE: Uptime-Kuma runs in the `monitoring` namespace, so cross-namespace
# targets MUST use FQDN service DNS (short names do not resolve across
# namespaces): <svc>.<ns>.svc.cluster.local
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: uptime-kuma-monitors
  namespace: monitoring
data:
  monitors.yaml: |
    monitors:
      - name: registry-docker-tcp
        type: port
        hostname: 192.168.0.236
        port: 5000
        interval: 60
        maxretries: 3
        description: Local Docker registry - custom images unpullable when down (openlingo, ai-backend, IIQ)
      - name: ollama-api
        type: http
        url: http://ollama.ai.svc.cluster.local:11434/
        interval: 60
        maxretries: 3
        description: Ollama API - language backends depend on it (stale-NFS outage 2026-09-06)
      - name: openwebui
        type: http
        url: http://openwebui.ai.svc.cluster.local:8080/
        interval: 60
        maxretries: 3
        description: Open WebUI frontend
      - name: openlingo
        type: http
        url: http://openlingo.openlingo.svc.cluster.local/
        interval: 60
        maxretries: 3
        description: OpenLingo language platform
      - name: homepage
        type: http
        url: http://homepage.homepage.svc.cluster.local/
        interval: 60
        maxretries: 3
        description: Homepage dashboard
      - name: beszel-hub
        type: http
        url: http://beszel-hub.monitoring.svc.cluster.local/
        interval: 60
        maxretries: 3
        description: Beszel cluster monitoring hub
      - name: uptime-kuma-self
        type: http
        url: http://uptime-kuma.monitoring.svc.cluster.local/
        interval: 60
        maxretries: 3
        description: Uptime-Kuma self check
      - name: ai-lang-backend
        type: http
        url: http://ai-lang-backend.ai-language-learning.svc.cluster.local/
        interval: 60
        maxretries: 3
        description: AI language tutor backend
      - name: ai-postgres
        type: port
        hostname: ai-postgres.ai-language-learning.svc.cluster.local
        port: 5432
        interval: 60
        maxretries: 3
        description: AI tutor Postgres database
      - name: openlingo-db
        type: port
        hostname: openlingo-db.openlingo.svc.cluster.local
        port: 5432
        interval: 60
        maxretries: 3
        description: OpenLingo Postgres database
      - name: linguacafe-web
        type: http
        url: http://linguacafe.linguacafe.svc.cluster.local/
        interval: 60
        maxretries: 3
        description: LinguaCafe reading app (down while mariadb faulted)
      - name: linguacafe-mariadb
        type: port
        hostname: mariadb.linguacafe.svc.cluster.local
        port: 3306
        interval: 60
        maxretries: 3
        description: LinguaCafe MariaDB (faulted - expected DOWN until recovery)
      - name: linguacafe-redis
        type: port
        hostname: redis.linguacafe.svc.cluster.local
        port: 6379
        interval: 60
        maxretries: 3
        description: LinguaCafe Redis cache
      - name: audiobookshelf
        type: http
        url: http://audiobookshelf.media.svc.cluster.local/
        interval: 60
        maxretries: 3
        description: AudioBookshelf audiobooks and podcasts
      - name: calibre-web
        type: http
        url: http://calibre-web.media.svc.cluster.local:8083/
        interval: 60
        maxretries: 3
        description: Calibre-Web ebook management
      - name: iiq-app
        type: port
        hostname: iiq.iiqstack.svc.cluster.local
        port: 80
        interval: 60
        maxretries: 3
        description: SailPoint IdentityIQ (TCP - context auth varies)
      - name: iiq-ldap
        type: port
        hostname: ldap.iiqstack.svc.cluster.local
        port: 389
        interval: 60
        maxretries: 3
        description: IIQ LDAP directory
      - name: iiq-activemq
        type: port
        hostname: activemq.iiqstack.svc.cluster.local
        port: 8161
        interval: 60
        maxretries: 3
        description: IIQ ActiveMQ console port (TCP - console needs auth)
      - name: iiq-mssql
        type: port
        hostname: db.iiqstack.svc.cluster.local
        port: 1433
        interval: 60
        maxretries: 3
        description: IIQ MSSQL database
      - name: iiq-mysql
        type: port
        hostname: db-mysql.iiqstack.svc.cluster.local
        port: 3306
        interval: 60
        maxretries: 3
        description: IIQ MySQL database
      - name: iiq-mailpit
        type: http
        url: http://mail.iiqstack.svc.cluster.local:8025/
        interval: 60
        maxretries: 3
        description: IIQ Mailpit email testing dashboard
      - name: iiq-phpldapadmin
        type: port
        hostname: phpldapadmin.iiqstack.svc.cluster.local
        port: 443
        interval: 60
        maxretries: 3
        description: phpLDAPadmin (TCP - self-signed TLS)
      - name: iiq-counter
        type: port
        hostname: counter.iiqstack.svc.cluster.local
        port: 12345
        interval: 60
        maxretries: 3
        description: IIQ demo counter utility
      - name: iiq-ssh
        type: port
        hostname: ssh.iiqstack.svc.cluster.local
        port: 22
        interval: 60
        maxretries: 3
        description: IIQ demo SSH host
      # -----------------------------------------------------------------------
      # Longhorn backup freshness push monitor.
      # The backup-daily-check CronJob (longhorn-backup-monitor.yaml) runs at
      # 04:00 UTC (30 min after backup-daily starts), checks that a Completed
      # backup younger than 26 h exists, and pushes status=up to this monitor.
      # If the push is not received within 2× the interval (3600 s), the
      # monitor goes DOWN, meaning the backup-daily cron never finished.
      # IMPORTANT: after this monitor is first created by the sync CronJob,
      # retrieve its push token from the Uptime-Kuma UI and update the
      # `longhorn-backup-push-token` Secret in the monitoring namespace.
      # The token format is: /api/push/<token>   (alphanumeric, ~8 chars)
      # -----------------------------------------------------------------------
      - name: longhorn-backup-daily
        type: push
        interval: 86400
        maxretries: 1
        description: "Longhorn backup-daily job — pushed by backup-daily-check CronJob at 04:00 UTC; goes DOWN if no Completed backup < 26 h"
# NOTE: the API credentials Secret is NOT in Git. It is generated by
# kustomize secretGenerator from the local-only file
# uptime-kuma-credentials.env (gitignored, see .gitignore):
#   username=suryendub
#   password=<uptime-kuma admin password>
# Name must stay `uptime-kuma-credentials` - the sync CronJob references it.

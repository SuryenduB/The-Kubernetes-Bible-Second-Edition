apiVersion: v1
kind: Secret
metadata:
  name: kuvasz-secrets
  namespace: monitoring
type: Opaque
stringData:
  postgresql-password: "KuvaszPostgres-2026-09-16-ChangeMe"
  admin-user: "admin"
  admin-password: "KuvaszAdmin-2026-09-16-ChangeMe"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kuvasz-config
  namespace: monitoring
data:
  kuvasz.yml: |
    timezone: Europe/Berlin
---
apiVersion: v1
kind: Service
metadata:
  name: kuvasz-postgresql
  namespace: monitoring
spec:
  selector:
    app: kuvasz-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kuvasz-postgresql
  namespace: monitoring
spec:
  serviceName: kuvasz-postgresql
  replicas: 1
  selector:
    matchLabels:
      app: kuvasz-postgresql
  template:
    metadata:
      labels:
        app: kuvasz-postgresql
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [kubernetes4]
      securityContext:
        fsGroup: 999
      containers:
        - name: postgresql
          image: pgautoupgrade/pgautoupgrade:18-alpine
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: kuvasz
            - name: POSTGRES_DB
              value: kuvasz
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kuvasz-secrets
                  key: postgresql-password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U kuvasz -d kuvasz"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U kuvasz -d kuvasz"]
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuvasz
  namespace: monitoring
  labels:
    app: kuvasz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kuvasz
  template:
    metadata:
      labels:
        app: kuvasz
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [kubernetes4]
      securityContext:
        fsGroup: 1000
      containers:
        - name: kuvasz
          image: kuvaszmonitoring/kuvasz:4.4.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TZ
              value: Europe/Berlin
            - name: DATABASE_HOST
              value: kuvasz-postgresql
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_NAME
              value: kuvasz
            - name: DATABASE_USER
              value: kuvasz
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kuvasz-secrets
                  key: postgresql-password
            - name: ENABLE_AUTH
              value: "true"
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: kuvasz-secrets
                  key: admin-user
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kuvasz-secrets
                  key: admin-password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /api/v2/health
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v2/health
              port: http
            initialDelaySeconds: 45
            timeoutSeconds: 5
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /config/kuvasz.yml
              subPath: kuvasz.yml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: kuvasz-config
---
apiVersion: v1
kind: Service
metadata:
  name: kuvasz
  namespace: monitoring
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/proxy-class: "tailscale-proxy"
    tailscale.com/hostname: "kuvasz"
spec:
  type: ClusterIP
  selector:
    app: kuvasz
  ports:
    - name: http
      port: 80
      targetPort: http

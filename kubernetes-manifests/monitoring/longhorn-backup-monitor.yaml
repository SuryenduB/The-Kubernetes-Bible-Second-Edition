# Backup freshness monitoring: Longhorn volume backups + K3s online etcd snapshots
# → Uptime-Kuma push monitor heartbeat.
#
# Runs at 04:00 K3s-controller local time daily, shortly after backup-daily
# completes (Longhorn recurring backup), and independently protects the
# online etcd NAS backup (cron 0 */6 * * * on nuc — see
# k3s-homelab-optimisation/scripts/k3s-etcd-safe-backup.sh).
#
# Flow:
#   1. Read backups.longhorn.io → newest Completed backup age (threshold 26 h)
#   2. Read etcdsnapshotfiles.k3s.cattle.io → newest etcd-snapshot-online-*
#      age (threshold 13 h = two missed 6-hourly cron runs + margin)
#   3. Push combined status to Uptime-Kuma push monitor "longhorn-backup-daily"
#
# If a push is not received within the monitor interval (86400 s = daily),
# the monitor goes DOWN in Uptime-Kuma (dashboard-visible).
#
# TOKEN DESYNC RECOVERY (the failure this manifest had in 2026-10):
#   Uptime-Kuma 2.x can rotate a push monitor's token (e.g. when its backing
#   store is rebuilt or the monitor is re-created by uptime-kuma-sync after a
#   fresh Kuma database). Then /api/push/<old-token> returns 404 and this
#   CronJob fails with an explicit remediation hint in its pod log. Repair:
#   read the monitor's current push_token from Uptime-Kuma and update Secret
#   monitoring/longhorn-backup-kuma-push (key "token"), then re-run a manual
#   Job from this CronJob to confirm a {'ok': True} push response.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-check-sa
  namespace: monitoring
---
# ClusterRole: read Longhorn backup CRs and K3s etcd snapshot-file CRs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: longhorn-backup-reader
rules:
  - apiGroups: ["longhorn.io"]
    resources: ["backups", "volumes"]
    verbs: ["get", "list"]
  - apiGroups: ["k3s.cattle.io"]
    resources: ["etcdsnapshotfiles"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: monitoring-backup-check
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: longhorn-backup-reader
subjects:
  - kind: ServiceAccount
    name: backup-check-sa
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-check-script
  namespace: monitoring
data:
  check.py: |
    """
    Backup freshness checker + Uptime-Kuma push reporter.

    Covers THREE independent checks:
      1. Longhorn volume backups   (backups.longhorn.io, 26 h threshold)
      2. K3s online etcd snapshots (etcdsnapshotfiles.k3s.cattle.io with
         snapshotName prefix "etcd-snapshot-online-", 13 h threshold;
         the producing cron runs every 6 h)
      3. Longhorn volume robustness (volumes.longhorn.io): any volume whose
         status.robustness is degraded or faulted → down; robustness unknown
         is held distinct (unknown on a detached volume is the normal
         "detached iiq volume" case and does NOT alert; unknown on a
         non-detached volume DOES count as bad)

    Exits 0  → all checks pass; status=up pushed.
    Exits 1  → Kubernetes API or push failure (infrastructure problem).
    Exits 2  → backup stale and/or degraded/faulted Longhorn volume →
               status=down pushed (Kuma alert).
    """
    import os, sys, json, ssl, urllib.request, urllib.parse, datetime

    KUMA_URL = os.environ["UPTIME_KUMA_URL"].rstrip("/")
    PUSH_TOKEN = os.environ["KUMA_PUSH_TOKEN"]
    MAX_AGE_H = float(os.environ.get("MAX_AGE_HOURS", "26"))
    MAX_ETCD_AGE_H = float(os.environ.get("MAX_ETCD_AGE_HOURS", "13"))
    now = datetime.datetime.now(datetime.timezone.utc)

    def k8s_get(url):
        with open("/var/run/secrets/kubernetes.io/serviceaccount/token") as f:
            token = f.read().strip()
        req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
        ca = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        with urllib.request.urlopen(req, context=ssl.create_default_context(cafile=ca), timeout=15) as resp:
            return json.loads(resp.read()).get("items", [])

    def age_s(ds):
        return (now - datetime.datetime.fromisoformat(ds.replace("Z", "+00:00"))).total_seconds()

    msg_parts = []

    # ── 1. Longhorn volume backup freshness ───────────────────────────────────
    try:
        items = k8s_get(
            "https://kubernetes.default.svc/apis/longhorn.io/v1beta2/"
            "namespaces/longhorn-system/backups"
        )
    except Exception as e:
        print(f"ERROR: Kubernetes API (longhorn backups) failed: {e}")
        items = []
    freshest_lh = None
    completed_count = 0
    for b in items:
        st = b.get("status", {})
        if st.get("state") != "Completed":
            continue
        completed_count += 1
        ds = st.get("backupCreatedAt") or st.get("lastSyncedAt") or ""
        if not ds:
            continue
        try:
            a = age_s(ds)
            if freshest_lh is None or a < freshest_lh:
                freshest_lh = a
        except Exception as e:
            print(f"WARN: unparseable backup timestamp '{ds}': {e}")

    if freshest_lh is None:
        lh_ok = False
        msg_parts.append(f"longhorn: NO completed backup ({completed_count} CRs)")
    elif freshest_lh > MAX_AGE_H * 3600:
        lh_ok = False
        msg_parts.append(f"longhorn: STALE {round(freshest_lh / 3600, 1)}h > {MAX_AGE_H}h")
    else:
        lh_ok = True
        msg_parts.append(f"longhorn: OK {round(freshest_lh / 3600, 1)}h ({completed_count} CRs)")

    # ── 2. K3s online etcd snapshot freshness ─────────────────────────────────
    try:
        snaps = k8s_get("https://kubernetes.default.svc/apis/k3s.cattle.io/v1/etcdsnapshotfiles")
    except Exception as e:
        print(f"ERROR: Kubernetes API (etcdsnapshotfiles) failed: {e}")
        snaps = []
    freshest_etcd = None
    online_count = 0
    for s in snaps:
        name = (s.get("spec") or {}).get("snapshotName", "")
        if not name.startswith("etcd-snapshot-online-"):
            continue
        online_count += 1
        ds = (s.get("metadata") or {}).get("creationTimestamp", "")
        if not ds:
            continue
        try:
            a = age_s(ds)
            if freshest_etcd is None or a < freshest_etcd:
                freshest_etcd = a
        except Exception as e:
            print(f"WARN: unparseable snapshot timestamp '{ds}': {e}")

    if freshest_etcd is None:
        etcd_ok = False
        msg_parts.append("etcd: NO online snapshot")
    elif freshest_etcd > MAX_ETCD_AGE_H * 3600:
        etcd_ok = False
        msg_parts.append(f"etcd: STALE {round(freshest_etcd / 3600, 1)}h > {MAX_ETCD_AGE_H}h")
    else:
        etcd_ok = True
        msg_parts.append(f"etcd: OK {round(freshest_etcd / 3600, 1)}h")

    # ── 3. Longhorn volume robustness (live data safety, same beat) ───────────
    # degraded → missing replica but serving; faulted → volume no longer
    # serving robustly; both are actionable data-safety conditions.
    try:
        vols = k8s_get(
            "https://kubernetes.default.svc/apis/longhorn.io/v1beta2/"
            "namespaces/longhorn-system/volumes"
        )
    except Exception as e:
        print(f"ERROR: Kubernetes API (longhorn volumes) failed: {e}")
        vols = []
    degraded_cnt = faulted_cnt = unknown_detached = unknown_other = 0
    bad_names = []
    for v in vols:
        st = v.get("status", {})
        name = (v.get("metadata") or {}).get("name", "")
        rb = st.get("robustness") or "unknown"
        state = st.get("state") or ""
        if rb == "degraded":
            degraded_cnt += 1
            bad_names.append(f"{name[:24]}[degraded/{state}]")
        elif rb == "faulted":
            faulted_cnt += 1
            bad_names.append(f"{name[:24]}[faulted/{state}]")
        elif rb == "unknown" and state != "detached":
            # unknown on an attached/attaching volume is not the expected
            # detached-idle case — treat it as suspicious but keep it
            # reported distinctly.
            unknown_other += 1
            bad_names.append(f"{name[:24]}[unknown/{state}]")
        elif rb == "unknown":
            unknown_detached += 1

    vol_ok = not bad_names
    if bad_names:
        shown = "; ".join(bad_names[:4])
        extra = "" if len(bad_names) <= 4 else f"; +{len(bad_names)-4} more"
        msg_parts.append(
            f"longhorn-vol: BAD {shown}{extra}"
            f" | degraded={degraded_cnt} faulted={faulted_cnt}"
            f" unknown-nondetached={unknown_other} unknown-detached={unknown_detached}"
        )
    else:
        msg_parts.append(
            f"longhorn-vol: OK {len(vols)} volumes"
            f" (unknown-detached={unknown_detached} expected)"
            if unknown_detached
            else f"longhorn-vol: OK {len(vols)} volumes, 0 degraded/faulted"
        )

    backup_ok = (lh_ok and etcd_ok and vol_ok)
    msg = " | ".join(msg_parts)
    print(f"Backup status: {msg}")

    # ── 3. Push heartbeat (token never logged) ────────────────────────────────
    status = "up" if backup_ok else "down"
    push_url = (
        f"{KUMA_URL}/api/push/{PUSH_TOKEN}"
        f"?status={status}&msg={urllib.parse.quote(msg)}&ping="
    )
    print(f"Pushing {status} → http://uptime-kuma/api/push/*** (token not logged)")
    try:
        resp = urllib.request.urlopen(push_url, timeout=15)
        body = json.loads(resp.read())
        print(f"Uptime-Kuma response: {body}")
    except Exception as e:
        if "HTTP Error 404" in str(e):
            print("ERROR: push failed 404 — push token desynchronised from Uptime-Kuma.")
            print(
                "FIX: read the monitor's current push_token from Uptime-Kuma and "
                "update Secret monitoring/longhorn-backup-kuma-push (key 'token'), "
                "then re-run a manual Job from this CronJob (see header of "
                "longhorn-backup-monitor.yaml)."
            )
        else:
            print(f"ERROR: push failed: {e}")
        sys.exit(1)

    if not backup_ok:
        # Exit non-zero so the K8s Job is marked Failed and visible in events
        print("Exiting 2 — one pipeline stale, status=down pushed.")
        sys.exit(2)

    print("Done.")
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-daily-check
  namespace: monitoring
spec:
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      template:
        spec:
          serviceAccountName: backup-check-sa
          restartPolicy: OnFailure
          containers:
            - name: check
              image: python:3.12-slim
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              env:
                - name: UPTIME_KUMA_URL
                  value: "http://uptime-kuma/"
                - name: KUMA_PUSH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: longhorn-backup-kuma-push
                      key: token
                - name: MAX_AGE_HOURS
                  value: "26"
                - name: MAX_ETCD_AGE_HOURS
                  value: "13"
              command: ["python3", "/scripts/check.py"]
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
          volumes:
            - name: scripts
              configMap:
                name: backup-check-script

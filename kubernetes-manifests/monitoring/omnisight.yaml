apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omnisight-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnisight
  namespace: monitoring
  labels:
    app: omnisight
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: omnisight
  template:
    metadata:
      labels:
        app: omnisight
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [kubernetes4]
      containers:
        - name: omnisight
          image: ghcr.io/caglaryalcin/omnisight:latest
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: TZ
              value: Europe/Berlin
          securityContext:
            allowPrivilegeEscalation: true
            privileged: true
            capabilities:
              add: [NET_RAW]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            timeoutSeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 45
            timeoutSeconds: 5
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: omnisight-data
---
apiVersion: v1
kind: Service
metadata:
  name: omnisight
  namespace: monitoring
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/proxy-class: "tailscale-proxy"
    tailscale.com/hostname: "omnisight"
spec:
  type: ClusterIP
  selector:
    app: omnisight
  ports:
    - name: http
      port: 80
      targetPort: http

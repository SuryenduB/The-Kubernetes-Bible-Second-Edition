apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: languard-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: languard
  namespace: monitoring
  labels:
    app: languard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: languard
  template:
    metadata:
      labels:
        app: languard
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [kubernetes4]
      containers:
        - name: backend
          image: ghcr.io/hillaliy/languard-backend:latest
          securityContext:
            privileged: true
          env:
            - name: SECRET_KEY
              value: "languard-k3s-production-secret-2026-change-me"
            - name: ALLOWED_HOSTS
              value: "languard.tail35421d.ts.net,192.168.0.25,127.0.0.1,localhost"
            - name: BACKEND_LISTEN_PORT
              value: "8000"
            - name: DB_PATH
              value: /data/db.sqlite3
            - name: STATIC_ROOT
              value: /static
          ports:
            - name: api
              containerPort: 8000
          volumeMounts:
            - name: data
              mountPath: /data
            - name: static
              mountPath: /static
          readinessProbe:
            httpGet:
              path: /api/v1/health/
              port: api
            initialDelaySeconds: 45
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health/
              port: api
            initialDelaySeconds: 90
            periodSeconds: 20
        - name: scheduler
          image: ghcr.io/hillaliy/languard-backend:latest
          securityContext:
            privileged: true
          command: ["python", "-u", "manage.py", "run_scheduler", "--run-now"]
          env:
            - name: SECRET_KEY
              value: "languard-k3s-production-secret-2026-change-me"
            - name: ALLOWED_HOSTS
              value: "languard.tail35421d.ts.net,192.168.0.25,127.0.0.1,localhost"
            - name: DB_PATH
              value: /data/db.sqlite3
            - name: STATIC_ROOT
              value: /static
          volumeMounts:
            - name: data
              mountPath: /data
            - name: static
              mountPath: /static
        - name: frontend
          image: ghcr.io/hillaliy/languard-frontend:latest
          env:
            - name: BACKEND_UPSTREAM
              value: 127.0.0.1:8000
            - name: FRONTEND_LISTEN_ADDRESS
              value: :8080
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: languard-data
        - name: static
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: languard
  namespace: monitoring
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/proxy-class: "tailscale-proxy"
    tailscale.com/hostname: "languard"
spec:
  type: ClusterIP
  selector:
    app: languard
  ports:
    - name: http
      port: 80
      targetPort: http

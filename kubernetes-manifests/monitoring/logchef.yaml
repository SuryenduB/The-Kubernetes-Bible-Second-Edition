apiVersion: v1
kind: ConfigMap
metadata:
  name: logchef-config
  namespace: monitoring
data:
  config.toml: |
    [server]
    host = "0.0.0.0"
    port = 8125

    [sqlite]
    path = "/data/local.db"

    [auth]
    admin_emails = ["admin@homelab.local"]
    api_token_secret = "logchef-k3s-api-token-secret-change-this-value-2026"

    [auth.local]
    enabled = true
    admin_email = "admin@homelab.local"

    [logging]
    level = "info"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: logchef-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logchef
  namespace: monitoring
  labels:
    app: logchef
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: logchef
  template:
    metadata:
      labels:
        app: logchef
    spec:
      securityContext:
        fsGroup: 1000
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [kubernetes4]
      containers:
        - name: logchef
          image: ghcr.io/mr-karan/logchef:latest
          env:
            - name: LOGCHEF_AUTH__LOCAL__ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logchef-admin
                  key: password
          ports:
            - name: http
              containerPort: 8125
          volumeMounts:
            - name: config
              mountPath: /etc/logchef/config.toml
              subPath: config.toml
              readOnly: true
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: logchef-config
        - name: data
          persistentVolumeClaim:
            claimName: logchef-data
---
apiVersion: v1
kind: Service
metadata:
  name: logchef
  namespace: monitoring
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/proxy-class: "tailscale-proxy"
    tailscale.com/hostname: "logchef"
spec:
  type: ClusterIP
  selector:
    app: logchef
  ports:
    - name: http
      port: 80
      targetPort: http

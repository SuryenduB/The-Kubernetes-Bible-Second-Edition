apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homelab-monitor-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-monitor
  namespace: monitoring
  labels:
    app: homelab-monitor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homelab-monitor
  template:
    metadata:
      labels:
        app: homelab-monitor
    spec:
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [kubernetes4]
      containers:
        - name: homelab-monitor
          image: sikamikaniko123/homelab-monitor:latest
          securityContext:
            capabilities:
              add: [SYS_PTRACE]
          env:
            - name: PORT
              value: "9800"
            - name: MCP_PORT
              value: "9810"
            - name: ENABLE_MCP
              value: "1"
            - name: SAMPLE_INTERVAL
              value: "10"
            - name: RETENTION_DAYS
              value: "180"
            - name: HOST_ROOT
              value: /rootfs
          ports:
            - name: http
              containerPort: 9800
            - name: mcp
              containerPort: 9810
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
            - name: host-root
              mountPath: /rootfs
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: homelab-monitor-data
        - name: host-root
          hostPath:
            path: /
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: homelab-monitor
  namespace: monitoring
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/proxy-class: "tailscale-proxy"
    tailscale.com/hostname: "homelab-monitor"
spec:
  type: ClusterIP
  selector:
    app: homelab-monitor
  ports:
    - name: http
      port: 80
      targetPort: http

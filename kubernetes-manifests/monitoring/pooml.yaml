apiVersion: v1
kind: Secret
metadata:
  name: pooml-secrets
  namespace: monitoring
type: Opaque
stringData:
  POOML_UI_SECRET: "pooml-ui-secret-2026-09-16-change-me-32chars"
  POOML_ENCRYPTION_KEY: "pooml-encryption-key-2026-09-16-change-me-32chars"
  POOML_DB_DIR: "/data"
  POOML_API_ADDR: "0.0.0.0:8080"
  POOML_UI_ADDR: "0.0.0.0:8081"
  POOML_ENV: "pro"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pooml-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pooml
  namespace: monitoring
  labels:
    app: pooml
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pooml
  template:
    metadata:
      labels:
        app: pooml
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [kubernetes4]
      securityContext:
        fsGroup: 1001
      containers:
        - name: pooml
          image: mykonordy/pooml:0.3.0
          ports:
            - name: api
              containerPort: 8080
            - name: ui
              containerPort: 8081
          envFrom:
            - secretRef:
                name: pooml-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: api
            initialDelaySeconds: 20
            timeoutSeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: api
            initialDelaySeconds: 45
            timeoutSeconds: 5
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pooml-data
---
apiVersion: v1
kind: Service
metadata:
  name: pooml-ui
  namespace: monitoring
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/proxy-class: "tailscale-proxy"
    tailscale.com/hostname: "pooml"
spec:
  type: ClusterIP
  selector:
    app: pooml
  ports:
    - name: ui
      port: 80
      targetPort: ui
---
apiVersion: v1
kind: Service
metadata:
  name: pooml-api
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: pooml
  ports:
    - name: api
      port: 8080
      targetPort: api

# Apprise API - stateless notification gateway (caronc/apprise).
#
# Runs fully stateless: STATEFUL_MODE=disabled turns off the /config store
# (no PVC needed) and per-request `urls=` on POST /notify selects targets.
# ATTACH_SIZE=0 disables attachment handling (no /attach volume needed).
# Reach 150+ services (incl. the local Gotify) via one HTTP call, e.g.:
#   POST http://apprise.monitoring.svc/notify
#   {"urls": "gotify://gotify/<app-token>", "body": "hello"}
# No auth on the API by design - gated by the private Tailnet only.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apprise
  namespace: monitoring
  labels:
    app: apprise
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: apprise
  template:
    metadata:
      labels:
        app: apprise
    spec:
      enableServiceLinks: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [kubernetes4]
      containers:
        - name: apprise
          image: caronc/apprise:v1.5.4
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APPRISE_STATEFUL_MODE
              value: "disabled"
            - name: APPRISE_ATTACH_SIZE
              value: "0"
            - name: APPRISE_WORKER_COUNT
              value: "1"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 20
            timeoutSeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 45
            timeoutSeconds: 5
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: apprise
  namespace: monitoring
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/proxy-class: "tailscale-proxy"
    tailscale.com/hostname: "apprise"
spec:
  type: ClusterIP
  selector:
    app: apprise
  ports:
    - name: http
      port: 80
      targetPort: http

apiVersion: v1
kind: Secret
metadata:
  name: lantern-secrets
  namespace: monitoring
type: Opaque
stringData:
  LANTERN_AUTH_USER: "admin"
  LANTERN_AUTH_PASS: "LanternAdmin-2026-09-16-ChangeMe"
  LANTERN_AUTH_TOKEN: "lantern-api-2026-09-16-token-change-me"
  LANTERN_DB_PATH: "/data/lantern.db"
  LANTERN_DOCKER_DISCOVERY: "false"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lantern-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lantern
  namespace: monitoring
  labels:
    app: lantern
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lantern
  template:
    metadata:
      labels:
        app: lantern
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [kubernetes4]
      containers:
        - name: lantern
          image: ghcr.io/manasvinyadav/lantern:v0.72.0
          ports:
            - name: http
              containerPort: 7654
          envFrom:
            - secretRef:
                name: lantern-secrets
          env:
            - name: LANTERN_PORT
              value: "7654"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            timeoutSeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lantern-data
---
apiVersion: v1
kind: Service
metadata:
  name: lantern
  namespace: monitoring
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/proxy-class: "tailscale-proxy"
    tailscale.com/hostname: "lantern"
spec:
  type: ClusterIP
  selector:
    app: lantern
  ports:
    - name: http
      port: 80
      targetPort: http

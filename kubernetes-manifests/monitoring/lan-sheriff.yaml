apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lan-sheriff-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lan-sheriff
  namespace: monitoring
  labels:
    app: lan-sheriff
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lan-sheriff
  template:
    metadata:
      labels:
        app: lan-sheriff
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [kubernetes4]
      containers:
        - name: lan-sheriff
          image: ghcr.io/291-group/lan-sheriff:latest
          args: ["serve", "--listen", "0.0.0.0:2911", "--data-dir", "/data", "--open=false"]
          securityContext:
            capabilities:
              add: [NET_RAW, NET_ADMIN]
              drop: [ALL]
          env:
            - name: LAN_SHERIFF_DATA_DIR
              value: /data
          ports:
            - name: http
              containerPort: 2911
            - name: peer
              containerPort: 2912
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lan-sheriff-data
---
apiVersion: v1
kind: Service
metadata:
  name: lan-sheriff
  namespace: monitoring
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/proxy-class: "tailscale-proxy"
    tailscale.com/hostname: "lan-sheriff"
spec:
  type: ClusterIP
  selector:
    app: lan-sheriff
  ports:
    - name: http
      port: 80
      targetPort: http

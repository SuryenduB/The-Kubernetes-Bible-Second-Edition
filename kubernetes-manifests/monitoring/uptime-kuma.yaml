apiVersion: v1
kind: ServiceAccount
metadata:
  name: uptime-kuma-sa
  namespace: monitoring
---
# NOTE: the `monitoring` Namespace itself is created by beszel-hub.yaml.
# This file intentionally does not duplicate it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uptime-kuma-data
  namespace: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: uptime-kuma
  template:
    metadata:
      labels:
        app: uptime-kuma
    spec:
      serviceAccountName: uptime-kuma-sa
      securityContext:
        fsGroup: 1000
      containers:
      - name: uptime-kuma
        # Pinned to the exact version observed running in-cluster (package.json
        # 2.5.5, image tag 2 previously resolved to it). Same minor line → no
        # migration involved; data store stays MariaDB-in-PVC (v2 architecture).
        image: louislam/uptime-kuma:2.5.5
        ports:
        - containerPort: 3001
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            cpu: 500m
            memory: 512Mi
        # TCP-socket checks are the supported probe for Kuma (no /health HTTP
        # endpoint in 2.x — SPA catches-all). startupProbe gives a fresh (or
        # damage-recovered) MariaDB cold start up to 3 min before liveness
        # counting begins; the socket does NOT depend on monitored services,
        # so never restarts Kuma because monitored services are down.
        startupProbe:
          tcpSocket:
            port: 3001
          periodSeconds: 6
          failureThreshold: 30
          timeoutSeconds: 2
        livenessProbe:
          tcpSocket:
            port: 3001
          initialDelaySeconds: 0
          periodSeconds: 60
        readinessProbe:
          tcpSocket:
            port: 3001
          initialDelaySeconds: 0
          periodSeconds: 30
        volumeMounts:
        - name: uptime-kuma-data
          mountPath: /app/data
      volumes:
      - name: uptime-kuma-data
        persistentVolumeClaim:
          claimName: uptime-kuma-data
---
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma
  namespace: monitoring
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/proxy-class: "tailscale-proxy"
    tailscale.com/hostname: "uptime-kuma"
    tailscale.com/tags: "tag:k8s"
spec:
  selector:
    app: uptime-kuma
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3001
  type: ClusterIP

apiVersion: v1
kind: Namespace
metadata:
  name: dashboard
---
apiVersion: v1
kind: Secret
metadata:
  name: homarr-secrets
  namespace: dashboard
type: Opaque
stringData:
  AUTH_SECRET: "homarr-k3s-auth-2026-09-16-rotate-if-exposed"
  SECRET_ENCRYPTION_KEY: "2f5a55a1f3aa5de5f9d4c6b2e1a8c0d7e3f4b6a9c1d2e5f708192a3b4c5d6e7f"
  DB_DRIVER: "better-sqlite3"
  DB_URL: "/appdata/db/db.sqlite"
  TURBO_TELEMETRY_DISABLED: "1"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homarr-data
  namespace: dashboard
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homarr
  namespace: dashboard
  labels:
    app: homarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homarr
  template:
    metadata:
      labels:
        app: homarr
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - kubernetes4
      securityContext:
        fsGroup: 1000
      containers:
        - name: homarr
          image: ghcr.io/homarr-labs/homarr:v1.77.1
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: homarr-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            timeoutSeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 90
            timeoutSeconds: 5
            periodSeconds: 20
          volumeMounts:
            - name: appdata
              mountPath: /appdata
      volumes:
        - name: appdata
          persistentVolumeClaim:
            claimName: homarr-data
---
apiVersion: v1
kind: Service
metadata:
  name: homarr
  namespace: dashboard
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/proxy-class: "tailscale-proxy"
    tailscale.com/hostname: "homarr"
spec:
  type: ClusterIP
  selector:
    app: homarr
  ports:
    - name: http
      port: 80
      targetPort: http

# Single-replica Longhorn StorageClass for lightweight workloads.
#
# Rationale (2026-09-17): cluster disks are ~80% full and only
# kubernetes8-debian has real headroom, so new 3-replica volumes cannot
# schedule (strict replica anti-affinity needs 3 distinct nodes with room).
# This class trades redundancy for schedulability: exactly 1 replica.
#
# Use ONLY for low-stakes data (caches, staging, file-drop metadata) where
# the app tolerates a rebuild. Never for identity, financial, or
# irreplaceable data. Revisit when disk capacity is added.
# Git is the source of truth - never create storage classes imperatively.
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-r1
provisioner: driver.longhorn.io
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
parameters:
  numberOfReplicas: "1"
  staleReplicaTimeout: "30"

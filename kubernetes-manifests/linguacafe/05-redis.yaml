apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: linguacafe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7.2-alpine
        ports:
        - containerPort: 6379
        command: ["redis-server", "--requirepass", "linguacafe"]
        # PING is the canonical Redis liveness/readiness check. The password
        # must be supplied because the server runs with --requirepass;
        # without it Redis replies "NOAUTH" and exits non-zero, which would
        # make the probe fail and restart-loop a healthy instance.
        startupProbe:
          exec:
            command: ["redis-cli", "-a", "linguacafe", "--no-auth-warning", "ping"]
          failureThreshold: 15
          periodSeconds: 5
        readinessProbe:
          exec:
            command: ["redis-cli", "-a", "linguacafe", "--no-auth-warning", "ping"]
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          exec:
            command: ["redis-cli", "-a", "linguacafe", "--no-auth-warning", "ping"]
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 5
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: linguacafe
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis

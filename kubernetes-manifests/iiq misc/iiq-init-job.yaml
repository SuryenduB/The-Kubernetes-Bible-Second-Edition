# ============================================================
# IdentityIQ Init Job - Creates MSSQL databases, users, schema
# Run ONCE before deploying the iiq deployment.
# ============================================================
# Image: 192.168.0.236:5000/sailpoint-iiq:8.5 (IIQ 8.5 — must match the
#   running app; SQL files are version-suffixed, e.g. ah-create_hibernate_tables-8.5.sqlserver).
#   Verified 2026-09-22: bash, unzip, /opt/mssql-tools18/bin/sqlcmd and /opt/iiq/identityiq.war all present.
#   Keep job and app images in lockstep: a mismatch makes every version-suffixed
#   SQL path fail with file-not-found (see README root cause #7).
# ============================================================
# FIXED 2026-09-22 (live-drift reconciliation):
#  - AH DDL used a nonexistent path (database/create_identityiq_ah_tables.sql) and
#    errors were swallowed by `2>/dev/null || echo skipped` — this silently left
#    identityiqah empty and crashed IIQ's VersionChecker (HTTP 404 outage).
#    Correct source: database/fragments/ah-create_hibernate_tables-8.5.sqlserver
#    + a table-count gate that FAILS the job if the AH schema is incomplete.
#  - Plugin DB needs the identityiqPlugin LOGIN/USER/SCHEMA (no tables);
#    the old path (create_identityiq_plugin_tables.sql) also did not exist.
#  - Job pod specs are IMMUTABLE: to re-run after the live job exists:
#      kubectl -n iiqstack delete job iiq-init
#      kubectl apply -f kubernetes-manifests/iiq\ misc/iiq-init-job.yaml
# ============================================================

apiVersion: batch/v1
kind: Job
metadata:
  name: iiq-init
  namespace: iiqstack
  labels:
    app: iiq-init
spec:
  backoffLimit: 3
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app: iiq-init
    spec:
      serviceAccountName: iiq-sa
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-all-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for all dependencies..."
              until nc -z db 1433; do echo "Waiting for MSSQL..."; sleep 5; done
              until nc -z db-mysql 3306; do echo "Waiting for MySQL..."; sleep 5; done
              until nc -z ldap 389; do echo "Waiting for LDAP..."; sleep 5; done
              until nc -z mail 1025; do echo "Waiting for Mail..."; sleep 5; done
              until nc -z activemq 61616; do echo "Waiting for ActiveMQ..."; sleep 5; done
              echo "All dependencies are ready."
      containers:
        - name: iiq-init
          image: 192.168.0.236:5000/sailpoint-iiq:8.5
          command:
            - /bin/bash
            - -c
          args:
            - |
              # 1. Unpack IdentityIQ WAR
              echo "Unpacking IdentityIQ WAR..."
              cd /opt/tomcat/webapps
              rm -rf identityiq
              mkdir -p identityiq
              unzip -qo /opt/iiq/identityiq.war -d identityiq
              cd identityiq/WEB-INF/classes

              # 2. Configure database connection
              echo "Configuring database connection..."
              cat > iiq.properties << 'PROPEOF'
              dataSource.url=jdbc:sqlserver://db:1433;databaseName=identityiq;encrypt=true;trustServerCertificate=true
              dataSource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
              dataSource.username=identityiq
              dataSource.password=id3ntityIQ!-TQ8BaiOxKAL4v-4lCIxVx
              sessionFactory.hibernateProperties.hibernate.dialect=sailpoint.persistence.SQLServerPagingDialect

              pluginsDataSource.url=jdbc:sqlserver://db:1433;databaseName=identityiqPlugin;encrypt=true;trustServerCertificate=true
              pluginsDataSource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
              pluginsDataSource.username=identityiqPlugin
              pluginsDataSource.password=id3ntityIQ!-TQ8BaiOxKAL4v-4lCIxVx

              dataSourceAccessHistory.url=jdbc:sqlserver://db:1433;databaseName=identityiqah;encrypt=true;trustServerCertificate=true
              dataSourceAccessHistory.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
              dataSourceAccessHistory.username=identityiq
              dataSourceAccessHistory.password=id3ntityIQ!-TQ8BaiOxKAL4v-4lCIxVx
              sessionFactoryAccessHistory.hibernateProperties.hibernate.dialect=sailpoint.persistence.SQLServerUnicodeDialect

              scheduler.quartzProperties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.MSSQLDelegate
              scheduler.quartzProperties.org.quartz.jobStore.selectWithLockSQL=SELECT * FROM {0}LOCKS UPDLOCK WHERE LOCK_NAME = ?
              PROPEOF

              # 3. Create databases if they don't exist
              echo "Creating databases..."
              /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$MSSQL_SA_PASSWORD" -No -C -Q "IF DB_ID('identityiq') IS NULL CREATE DATABASE identityiq"
              /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$MSSQL_SA_PASSWORD" -No -C -Q "IF DB_ID('identityiqPlugin') IS NULL CREATE DATABASE identityiqPlugin"
              /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$MSSQL_SA_PASSWORD" -No -C -Q "IF DB_ID('identityiqah') IS NULL CREATE DATABASE identityiqah"

              # 3b. Pre-create default schemas (ALTER USER ... WITH DEFAULT_SCHEMA requires the schema to exist)
              echo "Pre-creating default schemas..."
              /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$MSSQL_SA_PASSWORD" -No -C -Q "USE identityiq; IF SCHEMA_ID('identityiq') IS NULL EXEC('CREATE SCHEMA identityiq')"
              /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$MSSQL_SA_PASSWORD" -No -C -Q "USE identityiqPlugin; IF SCHEMA_ID('identityiqPlugin') IS NULL EXEC('CREATE SCHEMA identityiqPlugin')"
              /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$MSSQL_SA_PASSWORD" -No -C -Q "USE identityiqah; IF SCHEMA_ID('identityiqah') IS NULL EXEC('CREATE SCHEMA identityiqah')"

              # 4. Create login and users
              echo "Creating database user..."
              /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$MSSQL_SA_PASSWORD" -No -C -Q "IF NOT EXISTS (SELECT * FROM sys.sql_logins WHERE name = 'identityiq') CREATE LOGIN identityiq WITH PASSWORD = 'id3ntityIQ!-TQ8BaiOxKAL4v-4lCIxVx'"
              /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$MSSQL_SA_PASSWORD" -No -C -Q "USE identityiq; IF NOT EXISTS (SELECT * FROM sys.database_principals WHERE name = 'identityiq') CREATE USER identityiq FOR LOGIN identityiq; EXEC sp_addrolemember 'db_owner', 'identityiq'; ALTER USER identityiq WITH DEFAULT_SCHEMA = identityiq"
              # 4b. Plugin DB: pluginsDataSource authenticates as login identityiqPlugin (no tables required)
              /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$MSSQL_SA_PASSWORD" -No -C -Q "IF NOT EXISTS (SELECT * FROM sys.sql_logins WHERE name = 'identityiqPlugin') CREATE LOGIN identityiqPlugin WITH PASSWORD = 'id3ntityIQ!-TQ8BaiOxKAL4v-4lCIxVx'"
              /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$MSSQL_SA_PASSWORD" -No -C -Q "USE identityiqPlugin; IF NOT EXISTS (SELECT * FROM sys.database_principals WHERE name = 'identityiq') CREATE USER identityiq FOR LOGIN identityiq; EXEC sp_addrolemember 'db_owner', 'identityiq'; ALTER USER identityiq WITH DEFAULT_SCHEMA = identityiqPlugin"
              /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$MSSQL_SA_PASSWORD" -No -C -Q "USE identityiqPlugin; IF NOT EXISTS (SELECT * FROM sys.database_principals WHERE name = 'identityiqPlugin') CREATE USER identityiqPlugin FOR LOGIN identityiqPlugin; EXEC sp_addrolemember 'db_owner', 'identityiqPlugin'; ALTER USER identityiqPlugin WITH DEFAULT_SCHEMA = identityiqPlugin"
              /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$MSSQL_SA_PASSWORD" -No -C -Q "USE identityiqah; IF NOT EXISTS (SELECT * FROM sys.database_principals WHERE name = 'identityiq') CREATE USER identityiq FOR LOGIN identityiq; EXEC sp_addrolemember 'db_owner', 'identityiq'; ALTER USER identityiq WITH DEFAULT_SCHEMA = identityiqah"
              /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$MSSQL_SA_PASSWORD" -No -C -Q "USE identityiqah; IF NOT EXISTS (SELECT * FROM sys.database_principals WHERE name = 'identityiqah') CREATE USER identityiqah FOR LOGIN identityiq; EXEC sp_addrolemember 'db_owner', 'identityiqah'; ALTER USER identityiqah WITH DEFAULT_SCHEMA = identityiqah"

              # 5. Create synonym for spt_database_version
              echo "Creating synonym for spt_database_version..."
              /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$MSSQL_SA_PASSWORD" -No -C -Q "USE identityiq; IF NOT EXISTS (SELECT * FROM sys.synonyms WHERE name = 'spt_database_version') CREATE SYNONYM spt_database_version FOR identityiq.spt_database_version"

              # 6. Create schema if missing
              echo "Checking schema..."
              RESULT=$(/opt/mssql-tools18/bin/sqlcmd -S db -U identityiq -P "id3ntityIQ!-TQ8BaiOxKAL4v-4lCIxVx" -No -C -d identityiq -Q "IF OBJECT_ID('spt_database_version', 'U') IS NOT NULL SELECT '1' ELSE SELECT '0'" -h -1 | tr -d '[:space:]')
              if [ "$RESULT" = "0" ]; then
                echo "Schema missing, creating..."
                /opt/mssql-tools18/bin/sqlcmd -S db -U identityiq -P "id3ntityIQ!-TQ8BaiOxKAL4v-4lCIxVx" -No -C -i /opt/tomcat/webapps/identityiq/WEB-INF/database/create_identityiq_tables-8.5.sqlserver -d identityiq
                echo "Main schema created."
                # Plugin login/user/schema: created in step 4b. AH schema: step 7 (hard-gated).
                # Neither create_identityiq_plugin_tables.sql nor create_identityiq_ah_tables.sql
                # exists in the image — both were dead paths whose errors were swallowed.
              else
                echo "Schema already exists."
              fi

              # 7. Access History schema — REQUIRED by VersionChecker (dataSourceAccessHistory).
              #    Correct path: database/fragments/ah-create_hibernate_tables-8.5.sqlserver
              #    (schema-qualified identityiqah.spt_hist_*). Run WITHOUT -b so duplicate-object
              #    errors on re-runs don't abort mid-script, then hard-gate on the table count.
              AH_COUNT=$(/opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$MSSQL_SA_PASSWORD" -No -C -d identityiqah -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM identityiqah.INFORMATION_SCHEMA.TABLES WHERE TABLE_TYPE='BASE TABLE'" -h -1 | tr -d '[:space:]')
              if [ "${AH_COUNT:-0}" -lt 32 ]; then
                echo "identityiqah incomplete (${AH_COUNT}/32 tables). Dropping legacy synonym if present, running AH DDL..."
                /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$MSSQL_SA_PASSWORD" -No -C -d identityiqah -Q "IF EXISTS (SELECT 1 FROM sys.synonyms WHERE name = 'spt_hist_database_version' AND schema_id = SCHEMA_ID('dbo')) DROP SYNONYM dbo.spt_hist_database_version"
                /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$MSSQL_SA_PASSWORD" -No -C -d identityiqah -i /opt/tomcat/webapps/identityiq/WEB-INF/database/fragments/ah-create_hibernate_tables-8.5.sqlserver
                AH_COUNT=$(/opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$MSSQL_SA_PASSWORD" -No -C -d identityiqah -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM identityiqah.INFORMATION_SCHEMA.TABLES WHERE TABLE_TYPE='BASE TABLE'" -h -1 | tr -d '[:space:]')
              fi
              if [ "${AH_COUNT:-0}" -lt 32 ]; then
                echo "ERROR: identityiqah has ${AH_COUNT:-0}/32 base tables after DDL - VersionChecker will fail. Aborting init."
                exit 1
              fi
              echo "Access History schema OK (${AH_COUNT} tables)."

              # 8. Seed version rows if missing — VersionChecker requires BOTH
              #    system_version (app build) and schema_version (DB schema) to match
              #    the running image; the create scripts do NOT insert these rows.
              /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$MSSQL_SA_PASSWORD" -No -C -d identityiq -Q "IF NOT EXISTS (SELECT 1 FROM identityiq.spt_database_version WHERE name='main') INSERT INTO identityiq.spt_database_version (name, system_version, schema_version) VALUES ('main', '8.5-19', '8.5-15')"
              /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$MSSQL_SA_PASSWORD" -No -C -d identityiqah -Q "IF NOT EXISTS (SELECT 1 FROM identityiqah.spt_hist_database_version WHERE name='main') INSERT INTO identityiqah.spt_hist_database_version (name, system_version, schema_version) VALUES ('main', '8.5-19', '8.5-15')"
              /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$MSSQL_SA_PASSWORD" -No -C -d identityiq -Q "SELECT name, system_version, schema_version FROM identityiq.spt_database_version WHERE name='main'"
              echo "Version rows OK."

              echo "Initialization complete!"
          env:
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sailpoint-db-secrets
                  key: mssql-sa-password

# ============================================================
# Job: fix-db-corruption — PERSISTED FROM LIVE CLUSTER 2026-09-22
# (was live-only drift: existed in iiqstack but in no repo file)
#
# STATUS: SUSPENDED (suspend: true). Emergency repair from the 2026-09-20
# identityiq DB corruption incident — puts MSSQL into EMERGENCY/SINGLE_USER,
# runs DBCC CHECKDB REPAIR_ALLOW_DATA_LOSS, then DROPs identityiq.
#
# DANGER: un-suspending this job WILL DROP the identityiq database.
# It also mounts the db PVC directly (mssql-persistent-storage-db-0), so the
# db StatefulSet pod must be scaled down first for a clean run.
# Kept suspended as a runbook artifact. Delete when no longer needed:
#   kubectl -n iiqstack delete job fix-db-corruption
# ============================================================
apiVersion: batch/v1
kind: Job
metadata:
  labels:
    batch.kubernetes.io/controller-uid: 1e5ccd35-d001-47c6-85d5-2519e3dd63c0
    batch.kubernetes.io/job-name: fix-db-corruption
    controller-uid: 1e5ccd35-d001-47c6-85d5-2519e3dd63c0
    job-name: fix-db-corruption
  name: fix-db-corruption
  namespace: iiqstack
spec:
  backoffLimit: 6
  completionMode: NonIndexed
  completions: 1
  manualSelector: false
  parallelism: 1
  podReplacementPolicy: TerminatingOrFailed
  selector:
    matchLabels:
      batch.kubernetes.io/controller-uid: 1e5ccd35-d001-47c6-85d5-2519e3dd63c0
  suspend: true
  template:
    metadata:
      labels:
        batch.kubernetes.io/controller-uid: 1e5ccd35-d001-47c6-85d5-2519e3dd63c0
        batch.kubernetes.io/job-name: fix-db-corruption
        controller-uid: 1e5ccd35-d001-47c6-85d5-2519e3dd63c0
        job-name: fix-db-corruption
    spec:
      containers:
      - args:
        - |
          echo "Waiting for SQL Server to be ready..."
          until /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$(cat /var/run/secrets/kubernetes.io/serviceaccount/../mssql-sa-password)" -No -C -Q "SELECT 1" 2>/dev/null; do
            sleep 5
          done

          echo "Dropping corrupted identityiq database..."
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$(cat /var/run/secrets/kubernetes.io/serviceaccount/../mssql-sa-password)" -No -C -Q "ALTER DATABASE identityiq SET EMERGENCY" 2>/dev/null
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$(cat /var/run/secrets/kubernetes.io/serviceaccount/../mssql-sa-password)" -No -C -Q "ALTER DATABASE identityiq SET SINGLE_USER" 2>/dev/null
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$(cat /var/run/secrets/kubernetes.io/serviceaccount/../mssql-sa-password)" -No -C -Q "DBCC CHECKDB('identityiq', REPAIR_ALLOW_DATA_LOSS)" 2>/dev/null
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$(cat /var/run/secrets/kubernetes.io/serviceaccount/../mssql-sa-password)" -No -C -Q "DROP DATABASE identityiq" 2>/dev/null
          echo "Database dropped. Restarting SQL Server..."
        command:
        - /bin/bash
        - -c
        env:
        - name: MSSQL_SA_PASSWORD
          valueFrom:
            secretKeyRef:
              key: mssql-sa-password
              name: sailpoint-db-secrets
        image: mcr.microsoft.com/mssql/server:2019-CU28-ubuntu-20.04
        imagePullPolicy: IfNotPresent
        name: fix-db
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/opt/mssql
          name: mssql-data
      dnsPolicy: ClusterFirst
      restartPolicy: Never
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: mssql-data
        persistentVolumeClaim:
          claimName: mssql-persistent-storage-db-0

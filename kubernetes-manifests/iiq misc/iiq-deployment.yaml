# ============================================================
# IdentityIQ Deployment - Live State (2026-09-22)
# Applied via: kubectl apply -f iiq-deployment.yaml
# ============================================================
#
# IMPORTANT: This deployment requires pre-existing MSSQL setup:
#   1. Databases: identityiq, identityiqPlugin, identityiqah
#   2. Login: identityiq WITH PASSWORD = 'id3ntityIQ!-TQ8BaiOxKAL4v-4lCIxVx'
#   3. Users in each DB with db_owner role
#   4. Default schema for identityiq user MUST be 'identityiq' (not dbo)
#   5. Synonym: CREATE SYNONYM spt_database_version FOR identityiq.spt_database_version
#   6. User 'identityiqah' must exist in identityiqah database
# Run WindowsLab/iiq-mssql-setup.sql on the MSSQL server first.
#
# Secret required: sailpoint-db-secrets (namespace: iiqstack)
#   - mssql-sa-password
#   - mssql-user-password
#   - mysql-root-password
#   - mysql-user-password
#   - ldap-admin-password
#   - ssh-password
# ============================================================

---
apiVersion: v1
kind: Service
metadata:
  name: iiq
  namespace: iiqstack
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: iiq-main
    tailscale.com/proxy-class: tailscale-proxy
  labels:
    app: iiq
spec:
  type: ClusterIP
  selector:
    app: iiq
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iiq
  namespace: iiqstack
  labels:
    app: iiq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iiq
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: iiq
    spec:
      containers:
        - name: iiq
          image: 192.168.0.236:5000/sailpoint-iiq:8.5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: DATABASE_TYPE
              value: "mssql"
            - name: MSSQL_HOST
              value: "db"
            - name: MSSQL_SA_USER
              value: "sa"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sailpoint-db-secrets
                  key: mssql-sa-password
            - name: MSSQL_USER
              value: "identityiq"
            - name: MSSQL_PASS
              valueFrom:
                secretKeyRef:
                  name: sailpoint-db-secrets
                  key: mssql-user-password
            - name: CATALINA_OPTS
              value: "-Xmx3072M"
            - name: LDAP_HOST
              value: "ldap"
            - name: MAIL_HOST
              value: "mail"
            - name: MAIL_PORT
              value: "1025"
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          readinessProbe:
            httpGet:
              path: /identityiq/login.jsf
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 120
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 8
          livenessProbe:
            httpGet:
              path: /identityiq/login.jsf
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File

apiVersion: v1
kind: Secret
metadata:
  name: librislog-secrets
  namespace: media
type: Opaque
stringData:
  DATABASE_URL: "sqlite:///./data/librislog.db"
  API_KEY_ENCRYPTION_KEY: "vfB/hqrMBHCm/xj9ALrx3aHa+pKriKl+ieHm4ATA7VXEkrrS63MN16Jnybuoda9Q"
  AUTH_COOKIE_SECURE: "false"
  AUTH_COOKIE_SAMESITE: "lax"
  CORS_ORIGINS: '["http://librislog.tail35421d.ts.net"]'
  PUBLIC_APP_URL: "http://librislog.tail35421d.ts.net"
  TELEMETRY_DISABLED: "true"
  DASHBOARD_QUOTE_ENABLED: "false"
  FORWARDED_ALLOW_IPS: "*"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: librislog-data-pvc
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: librislog-backend
  namespace: media
  labels:
    app: librislog-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: librislog-backend
  template:
    metadata:
      labels:
        app: librislog-backend
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - kubernetes4
      securityContext:
        fsGroup: 1000
      containers:
        - name: backend
          image: ghcr.io/codebude/librislog/librislog-api:v1.9.0
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: librislog-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: librislog-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: media
spec:
  type: ClusterIP
  selector:
    app: librislog-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: librislog
  namespace: media
  labels:
    app: librislog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: librislog
  template:
    metadata:
      labels:
        app: librislog
    spec:
      containers:
        - name: frontend
          image: ghcr.io/codebude/librislog/librislog:v1.9.0
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: librislog
  namespace: media
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/proxy-class: "tailscale-proxy"
    tailscale.com/hostname: "librislog"
spec:
  type: ClusterIP
  selector:
    app: librislog
  ports:
    - name: http
      port: 80
      targetPort: http

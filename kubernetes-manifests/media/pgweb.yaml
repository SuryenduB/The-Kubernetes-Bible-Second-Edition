# pgweb - web-based PostgreSQL explorer (sosedoff/pgweb).
#
# Deliberately deployed WITHOUT a default DATABASE_URL: pgweb then shows
# its connection screen, so one instance reaches every Postgres in the
# cluster (bookorbit-db, immich-db, kuvasz-postgresql, openlingo-db,
# ai-postgres) with per-database credentials entered at login.
# No credentials are stored in this manifest; access is gated by the
# private Tailnet (no public ingress). No PVC: pgweb keeps no state.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgweb
  namespace: media
  labels:
    app: pgweb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pgweb
  template:
    metadata:
      labels:
        app: pgweb
    spec:
      enableServiceLinks: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - kubernetes4
      containers:
        - name: pgweb
          image: sosedoff/pgweb:0.17.0
          ports:
            - containerPort: 8081
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: pgweb
  namespace: media
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/proxy-class: "tailscale-proxy"
    tailscale.com/hostname: "pgweb"
spec:
  type: ClusterIP
  selector:
    app: pgweb
  ports:
    - name: http
      port: 80
      targetPort: http

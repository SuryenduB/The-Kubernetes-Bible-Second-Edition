apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookhoarder-data-pvc
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookhoarder
  namespace: media
  labels:
    app: bookhoarder
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bookhoarder
  template:
    metadata:
      labels:
        app: bookhoarder
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - kubernetes4
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: init-permissions
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - mkdir -p /data && chown -R 1000:1000 /data && chmod -R 777 /data
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: bookhoarder
          image: ghcr.io/bookhoard/bookhoarder:latest
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: STORAGE_DRIVER
              value: "local"
            - name: LOCAL_STORAGE_PATH
              value: "/data"
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bookhoarder-data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: bookhoarder
  namespace: media
  labels:
    app: bookhoarder
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/proxy-class: "tailscale-proxy"
    tailscale.com/hostname: "bookhoarder"
spec:
  type: ClusterIP
  selector:
    app: bookhoarder
  ports:
    - name: http
      port: 80
      targetPort: 3000

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bookhoarder-pdb
  namespace: media
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app: bookhoarder

# Chaptarr - audiobook & eBook collection manager (independent Readarr fork).
# Config (SQLite + settings) on Longhorn; library & download dirs on NAS NFS.
# IMPORTANT: mounts are ReadWrite (*arr apps rename/move files during import),
# unlike AudioBookshelf which mounts the same NAS dir read-only.
# Ownership: NAS library dirs are uid 502 gid 20 -> run with PUID=502/PGID=20
# so Chaptarr can write into /share/Public/audiobooks.
# The eBook dir is dedicated (/share/Public/ebooks) - do NOT point Chaptarr at
# /share/Public/calibre-library (Calibre-Web owns that library + metadata.db).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chaptarr-config
  namespace: media
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi

---
# Audiobooks PV (NAS NFS) - ReadWriteMany, forced to NFSv3 like siblings.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: chaptarr-books-pv
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - nfsvers=3
    - nolock
    - noatime
  nfs:
    server: 192.168.0.128
    path: /share/Public/audiobooks
  claimRef:
    name: chaptarr-books-pvc
    namespace: media

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chaptarr-books-pvc
  namespace: media
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: chaptarr-books-pv
  resources:
    requests:
      storage: 500Gi

---
# eBooks PV (NAS NFS) - Chaptarr-owned library, separate from Calibre-Web.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: chaptarr-ebooks-pv
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - nfsvers=3
    - nolock
    - noatime
  nfs:
    server: 192.168.0.128
    path: /share/Public/ebooks
  claimRef:
    name: chaptarr-ebooks-pvc
    namespace: media

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chaptarr-ebooks-pvc
  namespace: media
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: chaptarr-ebooks-pv
  resources:
    requests:
      storage: 500Gi

---
# Downloads drop-folder PV (NAS NFS) - staging for a future download client.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: chaptarr-downloads-pv
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - nfsvers=3
    - nolock
    - noatime
  nfs:
    server: 192.168.0.128
    path: /share/Public/downloads
  claimRef:
    name: chaptarr-downloads-pvc
    namespace: media

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chaptarr-downloads-pvc
  namespace: media
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: chaptarr-downloads-pv
  resources:
    requests:
      storage: 500Gi

---
# Chaptarr Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaptarr
  namespace: media
  labels:
    app: chaptarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: chaptarr
  template:
    metadata:
      labels:
        app: chaptarr
    spec:
      # Longhorn PVC is created root:root - pre-chown so any container uid works.
      initContainers:
        - name: init-permissions
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - mkdir -p /config && chown -R 502:20 /config && chmod -R 777 /config
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: chaptarr
          # 0.9.958 (2026-09-04) is the newest stable tag; `latest` still
          # points at the older 2026-08-08 build.
          image: chaptarr/chaptarr:0.9.958
          ports:
            - name: http
              containerPort: 8789
          env:
            # PUID/PGID must match the NAS library owner (502:20) or imports fail.
            - name: PUID
              value: "502"
            - name: PGID
              value: "20"
            - name: UMASK
              value: "002"
            - name: TZ
              value: "Europe/Berlin"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /
              port: 8789
            initialDelaySeconds: 60
            periodSeconds: 60
          readinessProbe:
            httpGet:
              path: /
              port: 8789
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /config
            - name: books
              mountPath: /audiobooks
            - name: ebooks
              mountPath: /ebooks
            - name: downloads
              mountPath: /downloads
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: chaptarr-config
        - name: books
          persistentVolumeClaim:
            claimName: chaptarr-books-pvc
        - name: ebooks
          persistentVolumeClaim:
            claimName: chaptarr-ebooks-pvc
        - name: downloads
          persistentVolumeClaim:
            claimName: chaptarr-downloads-pvc

---
# Service with Tailscale Integration (clean tailnet URL: port 80 -> 8789)
apiVersion: v1
kind: Service
metadata:
  name: chaptarr
  namespace: media
  labels:
    app: chaptarr
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/proxy-class: "tailscale-proxy"
    tailscale.com/hostname: "chaptarr"
spec:
  type: ClusterIP
  selector:
    app: chaptarr
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8789

---
# PodDisruptionBudget (matches media-namespace convention)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: chaptarr-pdb
  namespace: media
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app: chaptarr

apiVersion: apps/v1
kind: Deployment
metadata:
  name: flick-caddy
  namespace: media
  labels:
    app: flick-caddy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: flick-caddy
  template:
    metadata:
      labels:
        app: flick-caddy
    spec:
      enableServiceLinks: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - kubernetes4
      containers:
        - name: caddy
          image: caddy:2-alpine
          ports:
            - containerPort: 80
              name: http
          env:
            - name: FLICK_SITE_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: flick-secrets
                  key: FLICK_SITE_ADDRESS
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
            - name: caddy-data
              mountPath: /data
            - name: caddy-config
              mountPath: /config
      volumes:
        - name: caddyfile
          configMap:
            name: flick-caddyfile
        - name: caddy-data
          emptyDir: {}
        - name: caddy-config
          emptyDir: {}
---

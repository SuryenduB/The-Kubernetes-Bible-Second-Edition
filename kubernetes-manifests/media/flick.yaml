apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: flick-db
  namespace: media
spec:
  serviceName: flick-db
  replicas: 1
  selector:
    matchLabels:
      app: flick-db
  template:
    metadata:
      labels:
        app: flick-db
    spec:
      enableServiceLinks: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - kubernetes4
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: flick-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flick-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: flick-secrets
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: flick-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: flick-api
  namespace: media
  labels:
    app: flick-api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 15702
      targetPort: 15702
  selector:
    app: flick-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flick-api
  namespace: media
  labels:
    app: flick-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: flick-api
  template:
    metadata:
      labels:
        app: flick-api
    spec:
      enableServiceLinks: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - kubernetes4
      securityContext:
        fsGroup: 65532
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - until nc -z -w 2 flick-db 5432; do echo "Waiting for postgres on 5432..."; sleep 2; done
        - name: create-extension
          image: postgres:16-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: flick-secrets
                  key: POSTGRES_PASSWORD
          command:
            - /bin/sh
            - -c
            - until psql -h flick-db -U flick -d flick -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"; do echo "Waiting for postgres..."; sleep 2; done
        - name: migrate
          image: ghcr.io/amacneil/dbmate:2
          args: ["up"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flick-secrets
                  key: DATABASE_URL
            - name: DBMATE_MIGRATIONS_DIR
              value: "/db/migrations"
          volumeMounts:
            - name: migrations
              mountPath: /db/migrations
      containers:
        - name: api
          image: dellixou/flick-api:v0.2.8
          ports:
            - containerPort: 15702
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flick-secrets
                  key: DATABASE_URL
            - name: POSTGRES_HOST
              value: "flick-db"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: flick-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flick-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: flick-secrets
                  key: POSTGRES_DB
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /home/nonroot/.flick
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: flick-data-pvc
        - name: migrations
          configMap:
            name: flick-migrations
---

apiVersion: v1
kind: Secret
metadata:
  name: reactive-resume-secrets
  namespace: media
  labels:
    app.kubernetes.io/name: reactive-resume
    app.kubernetes.io/part-of: reactive-resume
type: Opaque
stringData:
  POSTGRES_DB: "postgres"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "rxResume_pg_2026_SecurePass!"
  DATABASE_URL: "postgresql://postgres:rxResume_pg_2026_SecurePass!@reactive-resume-db:5432/postgres"
  AUTH_SECRET: "a456f41974cab8b490074d9fe717cf180dd47422c6b53ff990365ddeab868f6d"

---
# PVC for Postgres Database (Longhorn RWO)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: reactive-resume-db-data
  namespace: media
  labels:
    app.kubernetes.io/name: reactive-resume-db
    app.kubernetes.io/part-of: reactive-resume
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi

---
# PVC for Application Local Uploads/Data (Longhorn RWO)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: reactive-resume-data
  namespace: media
  labels:
    app.kubernetes.io/name: reactive-resume
    app.kubernetes.io/part-of: reactive-resume
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi

---
# Headless/ClusterIP Service for PostgreSQL Database
apiVersion: v1
kind: Service
metadata:
  name: reactive-resume-db
  namespace: media
  labels:
    app.kubernetes.io/name: reactive-resume-db
    app.kubernetes.io/part-of: reactive-resume
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app: reactive-resume-db

---
# StatefulSet for PostgreSQL Database
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: reactive-resume-db
  namespace: media
  labels:
    app.kubernetes.io/name: reactive-resume-db
    app.kubernetes.io/part-of: reactive-resume
spec:
  serviceName: reactive-resume-db
  replicas: 1
  selector:
    matchLabels:
      app: reactive-resume-db
  template:
    metadata:
      labels:
        app: reactive-resume-db
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - kubernetes4
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
              protocol: TCP
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: reactive-resume-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: reactive-resume-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reactive-resume-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: reactive-resume-db-data

---
# Deployment for Reactive Resume App
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reactive-resume
  namespace: media
  labels:
    app.kubernetes.io/name: reactive-resume
    app.kubernetes.io/part-of: reactive-resume
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: reactive-resume
  template:
    metadata:
      labels:
        app: reactive-resume
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - kubernetes4
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1000:1000 /app/data && chmod -R 775 /app/data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for postgres to become reachable..."
              until nc -z reactive-resume-db 5432; do
                echo "Postgres is not reachable yet, waiting 2 seconds..."
                sleep 2
              done
              echo "Postgres is reachable!"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: reactive-resume
          image: ghcr.io/reactive-resume/reactive-resume:v5.3.1
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: APP_URL
              value: "http://reactive-resume"
            - name: LOCAL_STORAGE_PATH
              value: "/app/data"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: reactive-resume-secrets
                  key: DATABASE_URL
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: reactive-resume-secrets
                  key: AUTH_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: reactive-resume-data

---
# Service with Tailscale exposure
apiVersion: v1
kind: Service
metadata:
  name: reactive-resume
  namespace: media
  labels:
    app.kubernetes.io/name: reactive-resume
    app.kubernetes.io/part-of: reactive-resume
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/proxy-class: "tailscale-proxy"
    tailscale.com/hostname: "reactive-resume"
spec:
  type: ClusterIP
  selector:
    app: reactive-resume
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP


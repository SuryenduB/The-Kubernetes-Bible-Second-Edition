apiVersion: v1
kind: ConfigMap
metadata:
  name: netbox-config
  namespace: netbox
  labels:
    app.kubernetes.io/name: netbox
data:
  ALLOWED_HOSTS: "*"
  CORS_ORIGIN_ALLOW_ALL: "True"
  DB_HOST: "netbox-postgres"
  DB_PORT: "5432"
  DB_NAME: "netbox"
  DB_USER: "netbox"
  REDIS_HOST: "netbox-redis"
  REDIS_PORT: "6379"
  REDIS_DATABASE: "0"
  REDIS_CACHE_HOST: "netbox-redis"
  REDIS_CACHE_PORT: "6379"
  REDIS_CACHE_DATABASE: "1"
  METRICS_ENABLED: "true"
  MEDIA_ROOT: "/opt/netbox/netbox/media"
  HOUSEKEEPING_INTERVAL: "86400"
  SKIP_SUPERUSER: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: netbox
  namespace: netbox
  labels:
    app.kubernetes.io/name: netbox
    app.kubernetes.io/component: app
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/proxy-class: "tailscale-proxy"
    tailscale.com/hostname: "netbox"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
  selector:
    app.kubernetes.io/name: netbox
    app.kubernetes.io/component: app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbox
  namespace: netbox
  labels:
    app.kubernetes.io/name: netbox
    app.kubernetes.io/component: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: netbox
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbox
        app.kubernetes.io/component: app
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 0
      containers:
        - name: netbox
          image: netboxcommunity/netbox:v4.7.5-5.1.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: netbox-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netbox-secrets
                  key: DB_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netbox-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_CACHE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netbox-secrets
                  key: REDIS_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: netbox-secrets
                  key: SECRET_KEY
            - name: API_TOKEN_PEPPER_1
              valueFrom:
                secretKeyRef:
                  name: netbox-secrets
                  key: API_TOKEN_PEPPER_1
            - name: SUPERUSER_NAME
              valueFrom:
                secretKeyRef:
                  name: netbox-secrets
                  key: SUPERUSER_NAME
            - name: SUPERUSER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: netbox-secrets
                  key: SUPERUSER_EMAIL
            - name: SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netbox-secrets
                  key: SUPERUSER_PASSWORD
            - name: SUPERUSER_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: netbox-secrets
                  key: SUPERUSER_API_TOKEN
          volumeMounts:
            - name: media
              mountPath: /opt/netbox/netbox/media
          startupProbe:
            httpGet:
              path: /login/
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 35
          readinessProbe:
            httpGet:
              path: /login/
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /login/
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: netbox-media-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbox-worker
  namespace: netbox
  labels:
    app.kubernetes.io/name: netbox
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: netbox
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbox
        app.kubernetes.io/component: worker
    spec:
      # netbox-media-data is a Longhorn RWO volume shared by the app and worker.
      # Co-locate the worker with the app pod so both can mount it on one node.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values: ["app"]
                  - key: app.kubernetes.io/name
                    operator: In
                    values: ["netbox"]
              topologyKey: kubernetes.io/hostname
      enableServiceLinks: false
      securityContext:
        fsGroup: 0
      initContainers:
        - name: wait-for-netbox-web
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until wget -q -O - http://netbox:80/login/ >/dev/null 2>&1; do echo 'Waiting for NetBox web and database initialization...'; sleep 5; done; echo 'NetBox web is ready.'"
      containers:
        - name: worker
          image: netboxcommunity/netbox:v4.7.5-5.1.2
          imagePullPolicy: IfNotPresent
          command:
            - /opt/netbox/docker-entrypoint.sh
          args:
            - /opt/netbox/venv/bin/python
            - /opt/netbox/netbox/manage.py
            - rqworker
          envFrom:
            - configMapRef:
                name: netbox-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netbox-secrets
                  key: DB_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netbox-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_CACHE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netbox-secrets
                  key: REDIS_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: netbox-secrets
                  key: SECRET_KEY
            - name: API_TOKEN_PEPPER_1
              valueFrom:
                secretKeyRef:
                  name: netbox-secrets
                  key: API_TOKEN_PEPPER_1
          volumeMounts:
            - name: media
              mountPath: /opt/netbox/netbox/media
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: netbox-media-data

# Permanent Cloudflare Tunnel -> Homepage + Audiobookshelf (requires token).
#
# Steps (dashboard: Networking -> Tunnels -> Create Tunnel):
#   1. Create tunnel, copy the token from the install command:
#        cloudflared tunnel run --token eyJhIjoi....
#   2. Store it. Homelab convention allows a plaintext secret, but prefer:
#        kubectl -n cloudflare create secret generic cloudflared-token \
#          --from-literal=token='<PASTE_TOKEN>' --dry-run=client -o yaml | kubectl apply -f -
#      (this manifest's Secret block is a fallback; the command above overwrites it)
#   3. In the dashboard Routes tab add Published Application routes, OR rely on
#      the config.yaml ingress in this file (declarative, same result):
#        home.example.com   -> http://homepage.homepage.svc:80
#        audio.example.com  -> http://audiobookshelf.media.svc:80
#      Update both hostnames below to match your domain.
#   4. kubectl apply -f permanent-tunnel-homepage.yaml
#   5. Keep CF Access in front of both hostnames (email OTP / Google) so the
#      public endpoint is gated before traffic reaches the cluster.
#
# SECURITY: only these two browser-facing UIs are published. Databases
# (db, postgres, redis, mariadb), the ssh Service, the K3s API and
# Longhorn remain Tailscale-only. Do not add them here.
#
# NOT wired into the top-level kustomization.yaml on purpose: the Secret below
# holds a placeholder token until a real one is set.
apiVersion: v1
kind: Namespace
metadata:
  name: cloudflare
  labels:
    app.kubernetes.io/name: cloudflare-tunnel
---
apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-token
  namespace: cloudflare
  labels:
    app.kubernetes.io/name: cloudflared
type: Opaque
stringData:
  # Replace with the real token from `cloudflared tunnel run --token ...`
  token: TUNNEL_TOKEN_PLACEHOLDER
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudflared
  namespace: cloudflare
  labels:
    app.kubernetes.io/name: cloudflared
automountServiceAccountToken: false
---
# Empty by design: cloudflared only dials outbound to Cloudflare's edge and
# needs no Kubernetes API access.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudflared-no-access
  namespace: cloudflare
  labels:
    app.kubernetes.io/name: cloudflared
rules: []
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflare
  labels:
    app.kubernetes.io/name: cloudflared
data:
  config.yaml: |
    tunnel: REPLACE_WITH_TUNNEL_ID_OR_NAME
    credentials-file: /etc/cloudflared/creds/token.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      # Public hostname -> in-cluster Homepage (ClusterIP :80 -> pod :3000).
      - hostname: home.example.com
        service: http://homepage.homepage.svc:80
        originRequest:
          httpHostHeader: homepage.homepage.svc
      # Public hostname -> in-cluster Audiobookshelf (ClusterIP :80 -> pod :80).
      - hostname: audio.example.com
        service: http://audiobookshelf.media.svc:80
        originRequest:
          httpHostHeader: audiobookshelf.media.svc
          noTLSVerify: true
          keepAliveTimeout: 90s
          keepAliveConnections: 100
      - service: http_status:404
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-homepage
  namespace: cloudflare
  labels:
    app: cloudflared-homepage
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/component: tunnel
  annotations:
    kubernetes-specialist/review: "reviewed 2026-10-06; hardened (probes, securityContext, pinned image, nodeSelector), replicas 1->2, audiobookshelf origin added"
spec:
  # 2 replicas: the tunnel is the only public entry point, so it must survive a
  # single node loss (kubernetes-specialist: no single point of failure).
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: cloudflared-homepage
  template:
    metadata:
      labels:
        app: cloudflared-homepage
        app.kubernetes.io/name: cloudflared
    spec:
      serviceAccountName: cloudflared
      automountServiceAccountToken: false
      # Control-plane nodes only, and never kubernetes7 (failing disk). Role
      # label rather than kubernetes.io/hostname: the control-plane VMs carry
      # node-role.kubernetes.io/control-plane, the workers do not.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      tolerations:
        # nuc carries the legacy master taint, server-236/-252 the
        # control-plane one. Tolerate both.
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          # Pinned (kubernetes-specialist MUST NOT: never :latest in production).
          image: cloudflare/cloudflared:2025.8.1
          imagePullPolicy: IfNotPresent
          # Token mode: run with --token from env via shell expansion. Without a
          # real token the pod idles instead of crash-looping, so the rest of
          # the config stays verifiable.
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ "$TUNNEL_TOKEN" != "TUNNEL_TOKEN_PLACEHOLDER" ] && [ -n "$TUNNEL_TOKEN" ]; then
                exec cloudflared tunnel --no-autoupdate --metrics 0.0.0.0:2000 run --token "$TUNNEL_TOKEN"
              else
                echo "cloudflared-token not set; paste a real token into Secret cloudflared-token" >&2
                sleep 3600
              fi
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: token
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # ConfigMap is mounted for reference / file-mode use; token mode
            # reads TUNNEL_TOKEN from the environment instead.
            - name: config
              mountPath: /etc/cloudflared
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: cloudflared-config
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
# Cloudflare Tunnel - in-cluster connector publishing selected web services.
#
# Publishes ONLY browser-facing UIs. Databases, SSH, K3s API and Longhorn stay
# on Tailscale/LAN. Every origin uses an httpHostHeader rewrite because Homepage
# (and Traefik-less ClusterIP origins) validate the Host header.
#
# Pod security (kubernetes-specialist MUST-DO):
#   - runAsNonRoot + runAsUser 65532 (cloudflared's nonroot uid), fsGroup same
#   - readOnlyRootFilesystem, all writes redirected to /tmp
#   - drop ALL capabilities, seccomp RuntimeDefault
#   - pinned image (never :latest), resource requests+limits
#   - readiness/liveness probes on cloudflared's own /ready endpoint
# Placement: pinned to control-plane nodes only. kubernetes7 is excluded on
# purpose (failing disk, see homelab-nodes.json neverPowerOff).
#
# Deploy:
#   kubectl apply -f cloudflared.yaml
# Find the Quick Tunnel URL:
#   kubectl -n cloudflare logs -l app=cloudflared-homepage-quick --tail=20
apiVersion: v1
kind: Namespace
metadata:
  name: cloudflare
  labels:
    app.kubernetes.io/name: cloudflare-tunnel
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudflared
  namespace: cloudflare
  labels:
    app.kubernetes.io/name: cloudflared
automountServiceAccountToken: false
---
# --- Least-privilege RBAC: cloudflared needs no Kubernetes API access. It only
# dials outbound to Cloudflare's edge, so this Role is intentionally empty and
# exists to document that decision.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudflared-no-access
  namespace: cloudflare
  labels:
    app.kubernetes.io/name: cloudflared
rules: []
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflare
  labels:
    app.kubernetes.io/name: cloudflared
data:
  config.yaml: |
    tunnel: REPLACE_WITH_TUNNEL_ID_OR_NAME
    credentials-file: /etc/cloudflared/creds/token.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      # Public hostname -> in-cluster Homepage (ClusterIP :80 -> pod :3000).
      - hostname: home.example.com
        service: http://homepage.homepage.svc:80
        originRequest:
          httpHostHeader: homepage.homepage.svc
      # Public hostname -> in-cluster Audiobookshelf (ClusterIP :80 -> pod :80).
      # Origin requests are buffered (WebSocket/SSE-safe) so long-running
      # audio streams are not cut when cloudflared reconnects.
      - hostname: audio.example.com
        service: http://audiobookshelf.media.svc:80
        originRequest:
          httpHostHeader: audiobookshelf.media.svc
          noTLSVerify: true
          keepAliveTimeout: 90s
          keepAliveConnections: 100
      - service: http_status:404
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-homepage-quick
  namespace: cloudflare
  labels:
    app: cloudflared-homepage-quick
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/component: tunnel
  annotations:
    # Documents the deployment decision: quick tunnel is ephemeral/demo, so it
    # is kept at 1 replica. The permanent tunnel uses 2.
    kubernetes-specialist/review: "reviewed 2026-10-06; probes+securityContext added, image pinned, nodeSelector added"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: cloudflared-homepage-quick
  template:
    metadata:
      labels:
        app: cloudflared-homepage-quick
        app.kubernetes.io/name: cloudflared
    spec:
      serviceAccountName: cloudflared
      automountServiceAccountToken: false
      # Control-plane nodes only, and never kubernetes7 (failing disk). Role
      # label rather than kubernetes.io/hostname: the control-plane VMs carry
      # node-role.kubernetes.io/control-plane, the workers do not.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      tolerations:
        # nuc carries the legacy master taint, server-236/-252 the
        # control-plane one. Tolerate both.
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          # Pinned (kubernetes-specialist MUST NOT: never :latest in production).
          image: cloudflare/cloudflared:2025.8.1
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - --url
            - http://homepage.homepage.svc:80
            # Rewrite Host seen by Homepage so its allow-list passes without
            # needing to know the random trycloudflare hostname in advance.
            - --http-host-header
            - homepage.homepage.svc
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
apiVersion: v1
kind: Namespace
metadata:
  name: server-management
---
apiVersion: v1
kind: Secret
metadata:
  name: homelab-manger-secrets
  namespace: server-management
type: Opaque
stringData:
  ADMIN_PASSWORD: "K3sHomelab-Admin-2026-09-16-ChangeMe"
  SESSION_SECRET: "homelab-manger-session-k3s-2026-09-16-rotate"
  CREDENTIAL_KEY: "homelab-manger-credential-key-k3s-2026-09-16"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homelab-manger-data
  namespace: server-management
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-manger
  namespace: server-management
  labels:
    app: homelab-manger
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homelab-manger
  template:
    metadata:
      labels:
        app: homelab-manger
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - kubernetes4
      securityContext:
        fsGroup: 1000
      containers:
        - name: homelab-manger
          image: ghcr.io/spillebulle/homelab-manger:0.8.5
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: homelab-manger-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: homelab-manger-data
---
apiVersion: v1
kind: Service
metadata:
  name: homelab-manger
  namespace: server-management
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/proxy-class: "tailscale-proxy"
    tailscale.com/hostname: "homelab-manger"
spec:
  type: ClusterIP
  selector:
    app: homelab-manger
  ports:
    - name: http
      port: 80
      targetPort: http

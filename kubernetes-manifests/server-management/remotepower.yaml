apiVersion: v1
kind: Secret
metadata:
  name: remotepower-secrets
  namespace: server-management
type: Opaque
stringData:
  RP_ADMIN_USER: "admin"
  RP_ADMIN_PASS: "K3sRemotePower-Admin-2026-09-16-ChangeMe"
  RP_TLS_SELFSIGNED: "0"
  RP_WITH_SCANNER: "0"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: remotepower-data
  namespace: server-management
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remotepower
  namespace: server-management
  labels:
    app: remotepower
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: remotepower
  template:
    metadata:
      labels:
        app: remotepower
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - kubernetes4
      containers:
        - name: remotepower
          image: ghcr.io/tyxak/remotepower:7.0.3
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: remotepower-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            timeoutSeconds: 5
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/remotepower
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: remotepower-data
---
apiVersion: v1
kind: Service
metadata:
  name: remotepower
  namespace: server-management
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/proxy-class: "tailscale-proxy"
    tailscale.com/hostname: "remotepower"
spec:
  type: ClusterIP
  selector:
    app: remotepower
  ports:
    - name: http
      port: 80
      targetPort: http

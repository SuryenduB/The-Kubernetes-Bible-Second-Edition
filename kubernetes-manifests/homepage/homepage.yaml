---
apiVersion: v1
kind: Namespace
metadata:
  name: homepage
---
# Homepage dashboard config (services / settings / widgets). Edits here are
# mounted with subPath; update the pod-template checksum below after config edits.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  # href is opened by the browser; siteMonitor runs inside this pod.
  # Do not use ICMP ping against Tailscale proxies for HTTP availability.
  services.yaml: |
    - AI & Development:
      - ArgoCD:
          icon: argo-cd.png
          href: https://argocd.tail35421d.ts.net
          description: GitOps & Deployment
          siteMonitor: https://argocd-server.argocd.svc:443
      - OpenWebUI:
          icon: openai.png
          href: http://openwebui.tail35421d.ts.net:8080
          description: Local AI Chat (Ollama)
          siteMonitor: http://openwebui.ai.svc:8080
      - OpenLingo:
          icon: mdi-translate
          href: http://openlingo.tail35421d.ts.net
          description: Structured Language Platform
          siteMonitor: http://openlingo.openlingo.svc
      - AI Language Tutor:
          icon: mdi-book-open
          href: http://lang-tutor.tail35421d.ts.net
          description: Custom AI Language Learning
          siteMonitor: http://ai-lang-backend.ai-language-learning.svc
      - Ollama:
          icon: ollama.png
          description: AI model API (internal only; use OpenWebUI)
          siteMonitor: http://ollama.ai.svc:11434/
    - Management & Identity:
      - IdentityIQ:
          icon: mdi-fingerprint
          href: http://iiq-main.tail35421d.ts.net/identityiq/
          description: Identity Governance
          siteMonitor: http://iiq.iiqstack.svc/identityiq/
      - phpLDAPadmin:
          icon: openldap.png
          href: https://iiq-ldap-admin.tail35421d.ts.net
          description: LDAP Management
          siteMonitor: https://phpldapadmin.iiqstack.svc:443
      - ActiveMQ:
          icon: apache.png
          href: http://iiq-mq-admin.tail35421d.ts.net:8161
          description: Middleware Console
          siteMonitor: http://activemq.iiqstack.svc:8161
      - Mailpit:
          icon: mailpit.png
          href: http://iiq-mail.tail35421d.ts.net:8025
          description: Email Testing Dashboard
          siteMonitor: http://mail.iiqstack.svc:8025
    - Media:
      - AudioBookShelf:
          icon: audiobookshelf.png
          href: http://audiobookshelf.tail35421d.ts.net
          description: Audiobooks & Podcasts
          siteMonitor: http://audiobookshelf.media.svc
      - Calibre-Web:
          icon: calibre.png
          href: http://calibre-web.tail35421d.ts.net:8083
          description: Ebook Management
          siteMonitor: http://calibre-web.media.svc:8083
      - LinguaCafe:
          icon: linguacafe.png
          href: http://linguacafe.tail35421d.ts.net
          description: Language Reading App
          siteMonitor: http://linguacafe.linguacafe.svc
      - BookLogr:
          icon: mdi-bookshelf
          href: http://booklogr.tail35421d.ts.net
          description: Personal Reading Tracker
          siteMonitor: http://booklogr.media.svc
      - LibrisLog:
          icon: mdi-book-heart
          href: http://librislog.tail35421d.ts.net
          description: Household Reading Tracker
          siteMonitor: http://librislog.media.svc
      - BookHoarder:
          icon: mdi-bookshelf
          href: http://bookhoarder.tail35421d.ts.net
          description: Book library
          siteMonitor: http://bookhoarder.media.svc
      - BookOrbit:
          icon: mdi-bookshelf
          href: http://bookorbit.tail35421d.ts.net
          description: Book library
          siteMonitor: http://bookorbit.media.svc
      - Immich:
          icon: immich.png
          href: http://immich.tail35421d.ts.net
          description: Photo and video library
          siteMonitor: http://immich.media.svc/api/server/ping
    - Dashboards:
      - Homarr:
          icon: homarr.png
          href: http://homarr.tail35421d.ts.net
          description: Customizable Homelab Dashboard
          siteMonitor: http://homarr.dashboard.svc
      - Cairn:
          icon: mdi-view-dashboard-outline
          href: http://cairn.tail35421d.ts.net
          description: Homelab Service Directory
          siteMonitor: http://cairn.dashboard.svc
    - Server Management:
      - HomeLab Manger:
          icon: mdi-server-cog
          href: http://homelab-manger.tail35421d.ts.net
          description: Homelab Hardware Manager
          siteMonitor: http://homelab-manger.server-management.svc
      - RemotePower:
          icon: mdi-remote-desktop
          href: http://remotepower.tail35421d.ts.net
          description: Remote Server Management
          siteMonitor: http://remotepower.server-management.svc
    - Monitoring & Infrastructure:
      - Beszel:
          icon: beszel.png
          href: http://beszel.tail35421d.ts.net
          description: Cluster Monitoring
          siteMonitor: http://beszel-hub.monitoring.svc
      - Uptime-Kuma:
          icon: uptime-kuma.png
          href: http://uptime-kuma.tail35421d.ts.net
          description: Uptime Monitoring
          siteMonitor: http://uptime-kuma.monitoring.svc
      - Kuvasz:
          icon: mdi-shield-check
          href: http://kuvasz.tail35421d.ts.net
          description: Uptime & SSL Monitoring
          siteMonitor: http://kuvasz.monitoring.svc
      - Lantern:
          icon: mdi-lan-connect
          href: http://lantern.tail35421d.ts.net
          description: Homelab Status Dashboard
          siteMonitor: http://lantern.monitoring.svc
      - Pooml:
          icon: mdi-chart-timeline-variant
          href: http://pooml.tail35421d.ts.net
          description: Logs, Metrics & Alerts
          siteMonitor: http://pooml-ui.monitoring.svc
      - OmniSight:
          icon: mdi-eye-settings
          href: http://omnisight.tail35421d.ts.net
          description: Multi-platform Monitoring
          siteMonitor: http://omnisight.monitoring.svc
      - Dozzle:
          icon: mdi-text-box-search-outline
          href: http://dozzle.tail35421d.ts.net
          description: Kubernetes log viewer
          siteMonitor: http://dozzle.monitoring.svc
      - Gotify:
          icon: mdi-bell-ring
          href: http://gotify.tail35421d.ts.net
          description: Push notification server
          siteMonitor: http://gotify.monitoring.svc
      - LanGuard:
          icon: mdi-lan-connect
          href: http://languard.tail35421d.ts.net
          description: LAN discovery and monitoring
          siteMonitor: http://languard.monitoring.svc
      - LAN Sheriff:
          icon: mdi-shield-search
          href: http://lan-sheriff.tail35421d.ts.net
          description: Network traffic monitoring
          siteMonitor: http://lan-sheriff.monitoring.svc
      - HomeLab Monitor:
          icon: mdi-monitor-dashboard
          href: http://homelab-monitor.tail35421d.ts.net
          description: Host and homelab metrics
          siteMonitor: http://homelab-monitor.monitoring.svc
      - Trove:
          icon: mdi-server-network
          href: http://trove.tail35421d.ts.net
          description: Read-only infrastructure catalogue
          siteMonitor: http://trove.monitoring.svc
      - Logchef:
          icon: mdi-text-search
          href: http://logchef.tail35421d.ts.net
          description: Log analytics workspace
          siteMonitor: http://logchef.monitoring.svc
      - Longhorn UI:
          icon: longhorn.png
          description: Storage management (internal only; no browser endpoint)
          siteMonitor: http://longhorn-frontend.longhorn-system.svc
  settings.yaml: |
    title: "My Homelab Dashboard"
    headerStyle: "boxed"
    background:
      image: "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&q=80&w=2070"
      opacity: 30
    layout:
      AI & Development:
        style: "row"
        columns: 4
      Management & Identity:
        style: "row"
        columns: 4
      Media:
        style: "row"
        columns: 4
      Dashboards:
        style: "row"
        columns: 4
      Server Management:
        style: "row"
        columns: 4
      Monitoring & Infrastructure:
        style: "row"
        columns: 4
  widgets.yaml: |
    - kubernetes:
        cluster: "k3s"
        nodes: true
    - datetime:
        text_size: "xl"
        format:
          date: "MMMM Do, YYYY"
          time: "HH:mm"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      annotations:
        checksum/config: "308edfdbdf6f1c4761eb82046de44cd427a61b34ed65bf5eeda859423e0da7f7"
      labels:
        app: homepage
    spec:
      containers:
      - name: homepage
        image: ghcr.io/gethomepage/homepage:latest
        imagePullPolicy: Always
        env:
        - name: HOMEPAGE_ALLOWED_HOSTS
          value: "100.82.63.72,homepage-homepage,homepage-homepage.tail35421d.ts.net,homepage.homepage.svc.cluster.local,homepage.homepage.svc"
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: config
          mountPath: /app/config/settings.yaml
          subPath: settings.yaml
        - name: config
          mountPath: /app/config/services.yaml
          subPath: services.yaml
        - name: config
          mountPath: /app/config/widgets.yaml
          subPath: widgets.yaml
      volumes:
      - name: config
        configMap:
          name: homepage-config
---
# Exposed on the Tailnet via the Tailscale operator (Service annotations).
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
  annotations:
    tailscale.com/expose: "true"
spec:
  type: ClusterIP
  selector:
    app: homepage
  ports:
  - port: 80
    targetPort: 3000
---
# Only Homepage may probe the IIQ web applications; database ports stay private.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-homepage-web-monitoring
  namespace: iiqstack
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values: [iiq, phpldapadmin, activemq, mail]
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: homepage
      podSelector:
        matchLabels:
          app: homepage
    ports:
    - {protocol: TCP, port: 8080}
    - {protocol: TCP, port: 443}
    - {protocol: TCP, port: 8161}
    - {protocol: TCP, port: 8025}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-homepage-web-monitoring
  namespace: linguacafe
spec:
  podSelector:
    matchLabels:
      app: linguacafe
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: homepage
      podSelector:
        matchLabels:
          app: homepage
    ports:
    - {protocol: TCP, port: 80}

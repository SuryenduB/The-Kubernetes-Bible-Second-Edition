          siteMonitor: http://longhorn-frontend.longhorn-system.svc
  settings.yaml: |
    title: "My Homelab Dashboard"
    headerStyle: "boxed"
    background:
      image: "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&q=80&w=2070"
      opacity: 30
    layout:
      AI & Development:
        style: "row"
        columns: 4
      Management & Identity:
        style: "row"
        columns: 4
      Media:
        style: "row"
        columns: 4
      Dashboards:
        style: "row"
        columns: 4
      Server Management:
        style: "row"
        columns: 4
      Monitoring & Infrastructure:
        style: "row"
        columns: 4
  widgets.yaml: |
    - kubernetes:
        cluster: "k3s"
        nodes: true
    - datetime:
        text_size: "xl"
        format:
          date: "MMMM Do, YYYY"
          time: "HH:mm"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      annotations:
        checksum/config: "b1e484ed6101a4a1c6b1502e7b10619694d558c589ee32d16fb5e5572d066052"
      labels:
        app: homepage
    spec:
      containers:
      - name: homepage
        image: ghcr.io/gethomepage/homepage:latest
        imagePullPolicy: Always
        env:
        - name: HOMEPAGE_ALLOWED_HOSTS
          value: "100.82.63.72,homepage-homepage,homepage-homepage.tail35421d.ts.net,homepage.homepage.svc.cluster.local,homepage.homepage.svc"
        ports:
        - containerPort: 3000
        # Homepage exposes no /health or /api/health endpoint (verified: both
        # return 404), so the probe targets "/" - the Next.js root.
        #
        # The explicit Host header is REQUIRED. Homepage validates the Host
        # header against HOMEPAGE_ALLOWED_HOSTS and returns HTTP 400 for
        # anything else; kubelet would otherwise send the pod IP and the pod
        # would never go Ready.
        #
        # Note this must be `httpHeaders`, NOT the `host` field: `host` tells
        # kubelet which address to *connect to* (it would try to resolve
        # homepage.homepage.svc from the node and fail with "no such host").
        # A Host entry in httpHeaders only rewrites the header, keeping the
        # connection on the pod IP.
        startupProbe:
          httpGet:
            path: /
            port: 3000
            httpHeaders:
              - name: Host
                value: homepage.homepage.svc
          failureThreshold: 30
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 3000
            httpHeaders:
              - name: Host
                value: homepage.homepage.svc
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /
            port: 3000
            httpHeaders:
              - name: Host
                value: homepage.homepage.svc
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: config
          mountPath: /app/config/settings.yaml
          subPath: settings.yaml
        - name: config
          mountPath: /app/config/services.yaml
          subPath: services.yaml
        - name: config
          mountPath: /app/config/widgets.yaml
          subPath: widgets.yaml
      volumes:
      - name: config
        configMap:
          name: homepage-config
---
# Exposed on the Tailnet via the Tailscale operator (Service annotations).
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
  annotations:
    tailscale.com/expose: "true"
spec:
  type: ClusterIP
  selector:
    app: homepage
  ports:
  - port: 80
    targetPort: 3000
---
# Only Homepage may probe the IIQ web applications; database ports stay private.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-homepage-web-monitoring
  namespace: iiqstack
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values: [iiq, phpldapadmin, activemq, mail]
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: homepage
      podSelector:
        matchLabels:
          app: homepage
    ports:
    - {protocol: TCP, port: 8080}
    - {protocol: TCP, port: 443}
    - {protocol: TCP, port: 8161}
    - {protocol: TCP, port: 8025}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-homepage-web-monitoring
  namespace: linguacafe
spec:
  podSelector:
    matchLabels:
      app: linguacafe
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: homepage
      podSelector:
        matchLabels:
          app: homepage
    ports:
    - {protocol: TCP, port: 80}

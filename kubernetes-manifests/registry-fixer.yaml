apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: registry-fixer
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: registry-fixer
  template:
    metadata:
      labels:
        name: registry-fixer
    spec:
      hostNetwork: true
      tolerations:
      - operator: Exists # Ensure it runs on master too
      containers:
      - name: fixer
        image: busybox:1.36
        command: ["sh", "-c"]
        args:
        - |
          mkdir -p /host/etc/rancher/k3s
          cat <<EOF > /host/etc/rancher/k3s/registries.yaml
          mirrors:
            "192.168.0.236:5000":
              endpoint:
                - "http://192.168.0.236:5000"
          EOF
          echo "Registry config updated on $(hostname)"
          sleep 3600
        # Intentionally NO liveness/readiness probe. This container writes
        # registries.yaml once and then sleeps in a loop - it serves no
        # traffic and has no health endpoint to probe. A probe here would
        # only add failure modes (e.g. a busybox httpGet on a nonexistent
        # port restarting the pod every few minutes). DaemonSet membership
        # plus `sleep 3600` already guarantees the config is rewritten
        # hourly on every node.
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
          limits:
            cpu: 50m
            memory: 32Mi
        volumeMounts:
        - name: etc-k3s
          mountPath: /host/etc/rancher/k3s
      volumes:
      - name: etc-k3s
        hostPath:
          path: /etc/rancher/k3s
